<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Your Place 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ===== FACEBOOK LIGHT THEME ===== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Plus Jakarta Sans', system-ui, sans-serif; background:#f0f2f5; color:#050505; min-height:100vh; display:flex; flex-direction:column; line-height:1.5; }

  /* HEADER */
  .header { background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.08); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
  .logo { font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; color:#1877f2; cursor:pointer; }
  .header-right { display:flex; gap:8px; align-items:center; }
  .btn { background:#e4e6eb; color:#050505; padding:8px 16px; border-radius:6px; font-size:14px; font-weight:600; border:none; cursor:pointer; font-family:inherit; transition:background .2s; }
  .btn:hover { background:#d8dadf; }
  .btn.primary { background:#1877f2; color:#fff; }
  .btn.primary:hover { background:#166fe5; }

  /* NAV */
  .nav { background:#fff; border-top:1px solid #e4e6eb; display:flex; justify-content:center; gap:4px; padding:6px 0; position:sticky; top:57px; z-index:99; }
  .nav-btn { background:transparent; border:none; color:#65676b; padding:10px 20px; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:2px; transition:background .2s; }
  .nav-btn .nav-icon { font-size:22px; }
  .nav-btn:hover { background:#f0f2f5; }
  .nav-btn.active { color:#1877f2; border-bottom:3px solid #1877f2; border-radius:8px 8px 0 0; }

  /* LAYOUT */
  .main-wrapper { flex:1; max-width:1200px; margin:0 auto; width:100%; padding:16px; display:flex; gap:20px; justify-content:center; align-items:flex-start; }
  .content-area { width:100%; max-width:680px; }
  .panel { display:none; }
  .panel.active { display:block; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }

  /* CARDS */
  .card { background:#fff; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); margin-bottom:16px; overflow:hidden; }

  /* POST */
  .post-header { display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#1877f2; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; overflow:hidden; cursor:pointer; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .avatar.lg { width:80px; height:80px; font-size:32px; }
  
  .post-info { flex:1; min-width:0; cursor:pointer; }
  .post-name { font-weight:700; font-size:15px; color:#050505; }
  .post-name:hover { text-decoration:underline; }
  .post-time { font-size:12px; color:#65676b; }
  
  .post-image { width:100%; max-height:500px; object-fit:cover; display:block; background:#f0f2f5; cursor:pointer; }
  
  .post-stats { display:flex; justify-content:space-between; padding:10px 16px; color:#65676b; font-size:13px; }
  .post-actions { display:flex; border-top:1px solid #e4e6eb; padding:4px 8px; }
  .action-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:none; border:none; padding:8px; font-weight:600; font-size:14px; color:#65676b; cursor:pointer; border-radius:6px; font-family:inherit; transition:background .2s; }
  .action-btn:hover { background:#f0f2f5; }
  .action-btn.liked { color:#1877f2; }
  .delete-btn { color:#d93025; flex:0; padding:8px 12px; }
  .delete-btn:hover { background:#ffe5e5; }
  
  .post-caption { padding:4px 16px 12px; font-size:14px; }
  .post-caption strong { font-weight:700; margin-right:6px; }

  .comments-section { padding:12px 16px; border-top:1px solid #e4e6eb; background:#fafafa; }
  .comment { display:flex; gap:8px; margin-bottom:10px; }
  .comment .bubble { background:#f0f2f5; padding:8px 12px; border-radius:18px; font-size:13px; }
  .comment .bubble strong { font-weight:700; margin-right:4px; }
  .comment-input { display:flex; gap:8px; margin-top:8px; }
  .comment-input input { flex:1; padding:8px 12px; border-radius:20px; border:none; background:#f0f2f5; font-size:14px; font-family:inherit; outline:none; }
  .comment-input button { background:none; border:none; color:#1877f2; font-weight:700; font-size:13px; cursor:pointer; }

  /* PROFILE */
  .profile-cover { height:200px; background:linear-gradient(135deg,#1877f2,#00c6ff); border-radius:8px 8px 0 0; position:relative; }
  .profile-header-content { background:#fff; padding:0 24px 24px; position:relative; border-radius:0 0 8px 8px; text-align:center; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .profile-avatar-wrap { position:relative; display:inline-block; margin-top:-60px; margin-bottom:12px; }
  .profile-avatar-wrap .avatar.lg { border:4px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.15); background:#1877f2; cursor:default; }
  .edit-avatar-btn { position:absolute; bottom:0; right:0; background:#e4e6eb; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid #fff; font-size:14px; }
  .profile-name { font-size:24px; font-weight:800; margin-bottom:4px; }
  .profile-bio { font-size:14px; color:#65676b; margin-bottom:12px; }
  .profile-stats { display:flex; justify-content:center; gap:20px; margin-bottom:16px; border-top:1px solid #e4e6eb; border-bottom:1px solid #e4e6eb; padding:12px 0; }
  .stat-item { cursor:pointer; padding:4px 12px; border-radius:6px; transition:background .2s; }
  .stat-item:hover { background:#f0f2f5; }
  .stat-num { font-size:17px; font-weight:700; }
  .stat-label { font-size:13px; color:#65676b; }
  .profile-actions { display:flex; gap:8px; justify-content:center; }
  .grid-posts { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:#fff; border-radius:8px; overflow:hidden; }
  .grid-posts img { width:100%; aspect-ratio:1; object-fit:cover; cursor:pointer; transition:opacity .2s; }
  .grid-posts img:hover { opacity:.85; }

  /* SEARCH */
  .search-input { width:100%; padding:12px 16px; border-radius:8px; border:1px solid #e4e6eb; background:#fff; font-size:15px; font-family:inherit; outline:none; margin-bottom:16px; }
  .search-input:focus { border-color:#1877f2; }
  .user-row { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff; border-radius:8px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); cursor:pointer; transition:background .2s; }
  .user-row:hover { background:#f0f2f5; }
  .user-row .info { flex:1; }
  .user-row .name { font-weight:700; font-size:15px; }
  .follow-btn { background:#1877f2; color:#fff; border:none; padding:6px 16px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; }
  .follow-btn.following { background:#e4e6eb; color:#050505; }

  /* CHAT */
  .chat-list-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .chat-list-header h2 { font-size:20px; font-weight:800; }
  .room-item { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff; border-radius:8px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); cursor:pointer; transition:background .2s; }
  .room-item:hover { background:#f0f2f5; }
  .room-item .info { flex:1; min-width:0; }
  .room-item .name { font-weight:700; font-size:15px; }
  .room-item .preview { font-size:13px; color:#65676b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chat-container { display:flex; flex-direction:column; height:calc(100vh - 200px); max-height:700px; background:#fff; border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.1); overflow:hidden; }
  .chat-header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #e4e6eb; background:#fff; }
  .back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; color:#1877f2; }
  .chat-messages { flex:1; overflow-y:auto; padding:16px; background:#fafafa; display:flex; flex-direction:column; gap:8px; }
  .chat-msg { display:flex; gap:8px; align-items:flex-end; max-width:80%; }
  .chat-msg.self { flex-direction:row-reverse; margin-left:auto; }
  .chat-msg .bubble { background:#e4e6eb; padding:10px 14px; border-radius:18px; font-size:14px; word-break:break-word; }
  .chat-msg.self .bubble { background:#1877f2; color:#fff; }
  .chat-input-bar { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #e4e6eb; background:#fff; }
  .chat-input-bar input { flex:1; padding:10px 16px; border-radius:20px; border:none; background:#f0f2f5; font-size:14px; font-family:inherit; outline:none; }
  .chat-input-bar button { background:#1877f2; color:#fff; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:16px; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .modal-overlay.show { display:flex; }
  .modal-box { background:#fff; border-radius:8px; padding:24px; max-width:400px; width:100%; box-shadow:0 12px 28px rgba(0,0,0,.2); position:relative; }
  .close-x { position:absolute; top:12px; right:12px; background:none; border:none; font-size:24px; cursor:pointer; color:#65676b; }
  .modal-box h2 { font-size:20px; margin-bottom:16px; text-align:center; }
  .modal-field { margin-bottom:12px; }
  .modal-field label { display:block; font-size:12px; font-weight:600; color:#65676b; margin-bottom:4px; }
  .modal-field input, .modal-field textarea { width:100%; padding:12px; border-radius:6px; border:1px solid #ccd0d5; font-size:15px; font-family:inherit; outline:none; resize:vertical; }
  .modal-field input:focus, .modal-field textarea:focus { border-color:#1877f2; }
  .modal-submit { width:100%; background:#1877f2; color:#fff; border:none; padding:12px; border-radius:6px; font-weight:700; font-size:16px; cursor:pointer; margin-top:8px; }
  .modal-tabs { display:flex; margin-bottom:16px; border-bottom:1px solid #e4e6eb; }
  .modal-tab { flex:1; background:none; border:none; padding:10px; font-size:15px; font-weight:600; color:#65676b; cursor:pointer; border-bottom:3px solid transparent; }
  .modal-tab.active { color:#1877f2; border-bottom-color:#1877f2; }

  .contact-pick { display:flex; align-items:center; gap:10px; padding:10px; border-radius:6px; cursor:pointer; transition:background .2s; }
  .contact-pick:hover { background:#f0f2f5; }
  .contact-pick.selected { background:#e7f3ff; }

  /* FOOTER */
  .footer { text-align:center; padding:24px; color:#65676b; font-size:13px; background:#fff; border-top:1px solid #e4e6eb; margin-top:auto; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,100px); background:#333; color:#fff; padding:12px 24px; border-radius:6px; font-size:14px; z-index:99999; transition:transform .3s; }
  .toast.show { transform:translate(-50%,0); }
  
  .empty-state { text-align:center; padding:40px 20px; color:#65676b; }
  .empty-state .icon { font-size:48px; margin-bottom:12px; opacity:.5; }
  .loader { text-align:center; padding:40px; }
  .loader::after { content:''; display:inline-block; width:24px; height:24px; border:3px solid #e4e6eb; border-top-color:#1877f2; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }

  /* RESPONSIVE */
  @media(max-width:768px) {
    .main-wrapper { padding:8px; }
    .header { padding:10px 14px; }
    .logo { font-size:18px; }
    .nav { top:53px; padding:4px 0; }
    .nav-btn { padding:8px 12px; font-size:12px; }
    .nav-btn .nav-icon { font-size:20px; }
    .profile-cover { height:140px; }
    .profile-name { font-size:20px; }
    .post-header { padding:10px 12px; }
    .post-actions { padding:2px; }
    .action-btn { font-size:12px; }
    .chat-container { height:calc(100vh - 180px); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo" onclick="switchPanel('feed')">
    <span>📸</span> Your Place 2026
  </div>
  <div class="header-right" id="headerRight"></div>
</div>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" data-panel="feed"><span class="nav-icon">🏠</span>Home</button>
  <button class="nav-btn" data-panel="upload"><span class="nav-icon">➕</span>Post</button>
  <button class="nav-btn" data-panel="search"><span class="nav-icon">🔍</span>Search</button>
  <button class="nav-btn" data-panel="chat"><span class="nav-icon">💬</span>Chat</button>
  <button class="nav-btn" data-panel="profile"><span class="nav-icon">👤</span>Profile</button>
</div>

<!-- MAIN CONTENT -->
<div class="main-wrapper">
  <div class="content-area">
    <div class="panel active" id="panel-feed"></div>
    <div class="panel" id="panel-upload"></div>
    <div class="panel" id="panel-search"></div>
    <div class="panel" id="panel-chat"></div>
    <div class="panel" id="panel-profile"></div>
    <div class="panel" id="panel-other-profile"></div>
    <div class="panel" id="panel-single-post"></div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">Created by Dinidu Wijesinghe · Your Place 2026 © 2026</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authOverlay">
  <div class="modal-box">
    <button class="close-x" onclick="closeAuth()">×</button>
    <h2>Your Place 2026</h2>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</button>
      <button class="modal-tab" id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <div class="modal-error" id="authError" style="color:#d93025; font-size:13px; margin-bottom:10px; display:none;"></div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <!-- Login වෙද්දී Email එක අහනවා -->
      <div class="modal-field" id="emailField"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div>
      <!-- Signup වෙද්දී Username එක අහනවා -->
      <div class="modal-field" id="usernameField"><label>Username</label><input id="authUsername" type="text" placeholder="your_nickname" maxlength="20"></div>
      <div class="modal-field"><label>Password</label><input id="authPassword" type="password" placeholder="••••••••"></div>
      <button class="modal-submit" id="authSubmitBtn" type="submit">Login</button>
    </form>
  </div>
</div>

<!-- PROFILE EDIT MODAL -->
<div class="modal-overlay" id="editProfileOverlay">
  <div class="modal-box">
    <button class="close-x" onclick="closeEditProfile()">×</button>
    <h2>Edit Profile</h2>
    <div class="modal-field">
      <label>Username</label>
      <input id="editUsername" type="text" maxlength="20">
    </div>
    <div class="modal-field">
      <label>Bio</label>
      <textarea id="editBio" rows="3" placeholder="Tell us about yourself..." maxlength="200"></textarea>
    </div>
    <button class="modal-submit" id="editProfileBtn" onclick="saveProfile()">Save Changes</button>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="newChatOverlay">
  <div class="modal-box">
    <button class="close-x" onclick="closeNewChat()">×</button>
    <h2>New Chat</h2>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabDM" onclick="switchNewChatTab('dm')">Direct</button>
      <button class="modal-tab" id="tabGroup" onclick="switchNewChatTab('group')">Group</button>
    </div>
    <div id="groupNameField" style="display:none; margin-bottom:12px;">
      <input id="groupName" placeholder="Group Name" style="width:100%; padding:12px; border:1px solid #ccd0d5; border-radius:6px; font-size:15px;">
    </div>
    <div class="contact-picker" id="contactPicker" style="max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="modal-submit" id="createChatBtn" onclick="createChat()">Create Chat</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ujbepvlzrdvcmxpmdsez.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqYmVwdmx6cmR2Y214cG1kc2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTQwNjUsImV4cCI6MjEwNzk5MDA2NX0.-XzEMlr2W_4uOi0QDKaR4KmrPRJGPmXoDz6SlOjfqvE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let authMode = 'login';
let newChatMode = 'dm';
let selectedContacts = new Set();
let allUsersCache = [];
let activeRoomId = null;
let chatChannel = null;
let chatMessages = [];
let currentRooms = [];
let feedChannel = null;

function $(id){ return document.getElementById(id); }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500); }
function timeAgo(dateStr){
  const d=new Date(dateStr), now=new Date(), diff=Math.floor((now-d)/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString();
}

function avatarHTML(profile, size='40', clickable=true){
  if(!profile) return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${parseInt(size)/2.5}px;">?</div>`;
  const initial = (profile.username||'?').charAt(0).toUpperCase();
  const img = profile.avatar_url ? `<img src="${profile.avatar_url}" alt="">` : initial;
  const clickAttr = clickable ? `onclick="event.stopPropagation(); viewUserProfile('${profile.id}')"` : '';
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${parseInt(size)/2.5}px; ${clickable?'cursor:pointer;':''}" ${clickAttr}>${img}</div>`;
}

function switchPanel(name){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));
  if(name==='feed') renderFeed();
  if(name==='upload') renderUpload();
  if(name==='search') renderSearch();
  if(name==='chat') renderChatList();
  if(name==='profile' && currentUser) renderProfile(currentUser.id);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchPanel(b.dataset.panel)));

function updateHeader(){
  const box=$('headerRight');
  if(currentUser){
    box.innerHTML=`<button class="btn" onclick="doLogout()">Logout</button>`;
  } else {
    box.innerHTML=`<button class="btn" onclick="openAuth('login')">Login</button><button class="btn primary" onclick="openAuth('signup')">Sign Up</button>`;
  }
}

function openAuth(mode){
  authMode=mode||'login';
  $('authOverlay').classList.add('show');
  $('authError').style.display='none';
  switchAuthTab(authMode);
}
function closeAuth(){ $('authOverlay').classList.remove('show'); }
function switchAuthTab(mode){
  authMode=mode;
  const isLogin=mode==='login';
  $('tabLogin').classList.toggle('active',isLogin);
  $('tabSignup').classList.toggle('active',!isLogin);
  
  // Login වෙද්දී Email එක ඕන, Signup වෙද්දී Username එක ඕන
  $('emailField').style.display = 'block';
  $('usernameField').style.display = isLogin ? 'none' : 'block';
  
  $('authEmail').required = true;
  $('authUsername').required = !isLogin;
  
  $('authSubmitBtn').textContent = isLogin ? 'Login' : 'Create Account';
  $('authError').style.display='none';
}

async function handleAuth(e){
  e.preventDefault();
  const btn=$('authSubmitBtn'), err=$('authError');
  err.style.display='none'; btn.disabled=true; btn.textContent='Please wait...';
  
  try{
    if(authMode==='login'){
      // Login වෙද්දී කෙලින්ම Email එකයි Password එකයි ගන්නවා
      const email=$('authEmail').value.trim();
      const password=$('authPassword').value;
      if(!email || !password) throw new Error('Email and password required');
      
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      
      const {data:prof, error: pErr}=await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();
      if(pErr) throw pErr;
      
      currentUser={id:data.user.id,username:prof?prof.username:email.split('@')[0]};
      currentProfile=prof;
      toast('Welcome back, '+currentUser.username+'! 👋');
      closeAuth(); updateHeader(); switchPanel('feed'); subscribeFeed();
      $('authEmail').value='';$('authPassword').value='';
    } else {
      // Signup වෙද්දී ඔක්කොම ඕන
      const username=$('authUsername').value.trim();
      const password=$('authPassword').value;
      const email=$('authEmail').value.trim();
      if(!username||!password||!email) throw new Error('All fields required');
      if(username.length<3) throw new Error('Username must be 3+ characters');
      if(password.length<6) throw new Error('Password must be 6+ characters');
      
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});
      if(error) throw error;
      
      if(data.user && !data.session){
        toast('Check your email to confirm, then login.');
      } else {
        currentUser={id:data.user.id,username};
        toast('Account created! 🎉');
        closeAuth(); updateHeader(); switchPanel('feed'); subscribeFeed();
        $('authUsername').value='';$('authPassword').value='';$('authEmail').value='';
      }
    }
  }catch(ex){
    console.error(ex);
    err.textContent='❌ '+(ex.message||'Error');
    err.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent=authMode==='login'?'Login':'Create Account';
  }
}

async function doLogout(){
  if(!confirm('Logout?')) return;
  if(feedChannel){ sb.removeChannel(feedChannel); feedChannel=null; }
  if(chatChannel){ sb.removeChannel(chatChannel); chatChannel=null; }
  await sb.auth.signOut();
  currentUser=null; currentProfile=null;
  updateHeader(); switchPanel('feed');
  toast('Logged out');
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_OUT'||!session){ currentUser=null; currentProfile=null; }
  else if(session && !currentUser){
    const {data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(prof) currentUser={id:session.user.id,username:prof.username};
    currentProfile=prof;
  }
  updateHeader();
});
