<script>
// ============ CONFIG ============
const API_BASE = 'api.php';   // ← if cross-domain: 'https://your-backend.com/api.php'
const DPFP = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23EFEFEF'/><circle cx='50' cy='35' r='18' fill='%23B3B3B3'/><path d='M50 58 C28 58 18 72 18 100 L82 100 C82 72 72 58 50 58 Z' fill='%23B3B3B3'/></svg>";

// ============ API HELPER ============
async function api(action, opts = {}) {
  const url = API_BASE + '?action=' + action + (opts.query ? '&' + opts.query : '');
  const init = { method: opts.method || 'GET', credentials: 'include' };
  if (opts.body) {
    if (opts.form) init.body = opts.body;
    else { init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(opts.body); }
  }
  const r = await fetch(url, init);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ============ STATE ============
let currentUser=null, authMode='login', authBusy=false;
let onlineUsers=new Map(), presenceTimer=null;
let activeRoomId=null, activeMembers=[], chatPollTimer=null, lastMessageId=0, activeAdmin=null, currentChatTab='primary';
let currentViewingUserId=null, vpPosts=[];
let allChatsCache=[];
let reelsObserver=null;
let upFile=null, upType=null, upFilter='none', upObjUrl=null;

// ============ HELPERS ============
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s]+)/g,u=>`<a href="${u}" target="_blank" style="color:var(--blue);text-decoration:none">${u}</a>`);
const timeAgo=d=>{if(!d)return '';const t=new Date(d.replace(' ','T')+'Z').getTime();const s=Math.floor((Date.now()-t)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
function toast(m){const t=$('toast');t.textContent=m;t.style.transform='translateX(-50%) translateY(0)';t.style.opacity='1';setTimeout(()=>{t.style.transform='translateX(-50%) translateY(100px)';t.style.opacity='0'},2800)}

// ============ AUTH ============
function showAuth(){const o=$('authOverlay');o.classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.style.pointerEvents='none')}
function setAuthMode(m){
  authMode=m;const li=m==='login';
  $('authUsername').style.display=li?'none':'block';
  $('authBtn').textContent=li?'Log In':'Sign Up';
  $('authToggle').innerHTML=li?`Don't have an account? <span onclick="toggleAuthMode()">Sign up</span>`:`Have an account? <span onclick="toggleAuthMode()">Log in</span>`;
  $('authError').style.display='none';
}
function toggleAuthMode(){setAuthMode(authMode==='login'?'signup':'login')}

async function handleAuth(){
  if(authBusy)return;
  const email=$('authEmail').value.trim(), pass=$('authPassword').value, user=$('authUsername').value.trim();
  if(!email||!pass)return;
  authBusy=true;const b=$('authBtn');b.disabled=true;b.textContent='Please wait...';
  try{
    if(authMode==='login'){
      const {user:u} = await api('login', {method:'POST', body:{email, password:pass}});
      currentUser = u;
    }else{
      const {user:u} = await api('register', {method:'POST', body:{email, username:user, password:pass}});
      currentUser = u;
      toast('Welcome!');
    }
    $('authOverlay').classList.remove('active');
    document.querySelectorAll('.nav-btn').forEach(x=>x.style.pointerEvents='auto');
    initApp();
  }catch(ex){$('authError').textContent=ex.message;$('authError').style.display='block'}
  finally{authBusy=false;b.disabled=false;b.textContent=authMode==='login'?'Log In':'Sign Up'}
}

// ============ INIT ============
async function init(){
  setAuthMode('login');showAuth();
  try{
    const {user} = await api('me');
    currentUser = user;
    $('authOverlay').classList.remove('active');
    document.querySelectorAll('.nav-btn').forEach(x=>x.style.pointerEvents='auto');
    initApp();
  }catch(e){}
}
async function initApp(){
  $('navPfp').src=currentUser.avatar_url||DPFP;
  renderFeed();subscribePresence();
}
function subscribePresence(){
  if(presenceTimer)return;
  const beat = async ()=>{
    try{
      const {users} = await api('presence-list');
      onlineUsers.clear();
      (users||[]).forEach(u=>onlineUsers.set(String(u.id), u.username));
    }catch(e){}
  };
  beat();
  presenceTimer = setInterval(beat, 25000);
}

// ============ PANELS ============
function switchPanel(name){
  closeReels();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const el=$('panel-'+name);if(el)el.classList.add('active');
  $('topNav').style.display=name==='chat'?'none':'flex';
  if(name==='feed')renderFeed();
  if(name==='profile'&&currentUser)renderProfile(currentUser.id);
  if(name==='search')renderSearch();
  if(name==='chat')renderChat();
}

// ============ FOLLOWS ============
async function getStats(uid){try{return await api('stats',{query:'id='+uid});}catch(e){return{followers:0,following:0}}}
async function isFollowing(a,b){try{const r=await api('follow-status',{query:'id='+b});return r.is_following;}catch(e){return false}}
async function isPending(a,b){try{const r=await api('follow-status',{query:'id='+b});return r.is_pending;}catch(e){return false}}
async function toggleFollow(target,isPriv){
  try{
    const {status} = await api('follow',{method:'POST',body:{user_id:target}});
    if(status==='accepted')return'following';
    if(status==='pending')return'requested';
    return'unfollowed';
  }catch(e){toast('Error: '+e.message);return null}
}
async function followBtnClick(target,btn,isPriv){
  btn.disabled=true;
  const r=await toggleFollow(target,isPriv);
  if(r==='following'){btn.textContent='Following';btn.className='follow-btn following'}
  else if(r==='unfollowed'){btn.textContent='Follow';btn.className='follow-btn'}
  else if(r==='requested'){btn.textContent='Requested';btn.className='follow-btn requested'}
  btn.disabled=false;
}
async function followFromProfile(){
  if(!currentViewingUserId)return;
  const b=$('vpFollowBtn');b.disabled=true;
  const{user} = await api('profile', {query:'id='+currentViewingUserId});
  const r=await toggleFollow(currentViewingUserId, !!user.is_private);
  if(r==='following'){b.textContent='Following';b.className='profile-btn'}
  else if(r==='unfollowed'){b.textContent='Follow';b.className='profile-btn primary'}
  else if(r==='requested'){b.textContent='Requested';b.className='profile-btn'}
  const s=await getStats(currentViewingUserId);
  $('vpFollowersCount').textContent=s.followers;$('vpFollowingCount').textContent=s.following;
  b.disabled=false;
  if(r==='following')viewUserProfile(currentViewingUserId);
}

// ============ FEED ============
async function renderFeed(){
  const el=$('panel-feed');el.innerHTML='<div class="spinner"></div>';
  try{
    const {stories, posts} = await api('feed');
    let storiesHtml=`<div class="stories"><button class="story" onclick="openUpload()"><div class="story-ring add">+</div><div class="story-name">Your story</div></button>`;
    const seen=new Set();
    (stories||[]).forEach(s=>{
      if(seen.has(s.user_id))return;seen.add(s.user_id);
      if(s.user_id!==currentUser.id&&s.is_private)return;
      storiesHtml+=`<button class="story"><div class="story-ring"><img src="${s.avatar_url||DPFP}"></div><div class="story-name">${esc(s.username)}</div></button>`;
    });
    storiesHtml+='</div>';
    if(!posts||posts.length===0){
      el.innerHTML=storiesHtml+`<div style="padding:60px 24px;text-align:center;color:var(--text-2);font-size:15px"><div style="font-size:52px;margin-bottom:16px">📷</div><div style="font-weight:600;color:var(--text);font-size:18px;margin-bottom:6px">Share Photos</div><div style="font-size:14px;color:var(--text-2);line-height:1.4">When you share photos, they'll appear on your profile.</div><button style="margin-top:20px;background:var(--blue);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer" onclick="openUpload()">Share your first photo</button></div>`;
      return;
    }
    el.innerHTML=storiesHtml+posts.map(p=>{
      const liked=Number(p.liked_by_me)>0;
      const isVid=p.video_url&&p.video_url.length>0;
      const likeCount=Number(p.like_count)||0;
      const commentCount=Number(p.comment_count)||0;
      return `<div class="post" data-post="${p.id}">
        <div class="post-head" onclick="viewUserProfile('${p.user_id}')">
          <div class="post-avatar"><img src="${p.avatar_url||DPFP}"></div>
          <div style="flex:1"><div class="post-name">${esc(p.username)} ${p.is_private?'🔒':''}</div></div>
          <button class="post-more" onclick="event.stopPropagation();postMenu(${p.id},${p.user_id===currentUser.id})">⋯</button>
        </div>
        <div class="post-media" onclick="${isVid?`openReels(${p.id})`:`openPostViewer(${p.id})`}">
          ${isVid?`<video src="${p.video_url}#t=0.1" preload="metadata" muted playsinline></video><div class="video-badge">▶</div>`:`<img src="${p.image_url}" onerror="this.src='${DPFP}'">`}
        </div>
        <div class="post-actions">
          <button class="pa-btn ${liked?'liked':''}" onclick="toggleLike(${p.id},this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <button class="pa-btn" onclick="openPostViewer(${p.id})">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </button>
          <button class="pa-btn">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
          <button class="pa-btn bookmark">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>
        <div class="post-likes" id="likes-${p.id}">${likeCount} ${likeCount===1?'like':'likes'}</div>
        ${p.caption?`<div class="post-caption"><strong onclick="viewUserProfile('${p.user_id}')">${esc(p.username)}</strong>${linkify(p.caption)}</div>`:''}
        ${commentCount>0?`<div class="post-comments-link" onclick="openPostViewer(${p.id})">View all ${commentCount} comments</div>`:''}
        <div class="post-time">${timeAgo(p.created_at)}</div>
      </div>`;
    }).join('');
  }catch(ex){console.error(ex);el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-2)">Error loading feed. Check console.</div>`}
}

// ============ POST MENU / DELETE ============
function postMenu(id,isOwn){if(!isOwn)return;if(confirm('Delete this post?'))deletePost(id);}
async function deletePost(id){
  try{
    await api('delete-post',{query:'id='+id});
    toast('Deleted');
    if($('panel-feed').classList.contains('active'))renderFeed();
    if($('panel-profile').classList.contains('active'))renderProfile(currentUser.id);
  }catch(e){toast('Error')}
}

// ============ LIKE ============
async function toggleLike(pid,btn){
  const liked=btn.classList.contains('liked');
  btn.classList.toggle('liked');
  const el=$('likes-'+pid);
  if(el){let n=parseInt(el.textContent)||0;const v=liked?Math.max(0,n-1):n+1;el.textContent=`${v} ${v===1?'like':'likes'}`}
  try{ await api('like',{method:'POST',body:{post_id:pid}}); }
  catch(e){btn.classList.toggle('liked');toast('Error')}
}

// ============ POST VIEWER ============
async function openPostViewer(pid){
  const w=$('viewerWrap');w.innerHTML='<div class="spinner" style="margin:100px auto;border-color:rgba(255,255,255,0.2);border-top-color:#fff"></div>';
  $('viewPostModal').classList.add('active');
  try{
    const {post:p} = await api('post',{query:'id='+pid});
    const liked=Number(p.liked_by_me)>0;
    const isV=p.video_url&&p.video_url.length>0;
    const isOwn=p.user_id===currentUser.id;
    const likeCount=Number(p.like_count)||0;
    const header=`<div class="viewer-side-head"><img src="${p.avatar_url||DPFP}" onclick="closePostViewer();viewUserProfile('${p.user_id}')" style="cursor:pointer"><div style="flex:1"><div class="un">${esc(p.username)}</div></div>${isOwn?`<button onclick="deletePost(${p.id});closePostViewer()" style="background:none;border:none;font-size:16px;cursor:pointer">🗑️</button>`:''}</div>`;
    const media=isV?`<video src="${p.video_url}" controls autoplay playsinline></video>`:`<img src="${p.image_url}" onerror="this.src='${DPFP}'">`;
    const actions=`<div class="viewer-side-actions"><div class="row1"><button class="pa-btn ${liked?'liked':''}" onclick="toggleLike(${p.id},this)"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:${liked?'var(--red)':'currentColor'};stroke-width:2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><button class="pa-btn"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button><button class="pa-btn"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button><button class="pa-btn bookmark"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button></div><div class="viewer-likes" id="likes-${p.id}">${likeCount} ${likeCount===1?'like':'likes'}</div><div style="font-size:14px;line-height:1.4"><strong>${esc(p.username)}</strong> ${linkify(p.caption||'')}</div></div>`;
    const commentList=(p.comments||[]).map(c=>`<div class="viewer-side-comment"><strong>${esc(c.username)}</strong>${linkify(c.text)}</div>`).join('');
    const commentRow=`<div class="viewer-comment-row"><input type="text" id="vcInput-${p.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addViewerComment(${p.id})"><button onclick="addViewerComment(${p.id})">Post</button></div>`;
    w.innerHTML=`<div class="viewer">
      <button class="viewer-close-mobile" onclick="closePostViewer()">←</button>
      <div class="viewer-media">${media}</div>
      <div class="viewer-side">${header}<div class="viewer-side-comments">${commentList||'<div style="text-align:center;color:var(--text-2);font-size:14px;padding:20px">No comments yet.</div>'}</div>${actions}${commentRow}</div>
      <div class="viewer-mobile-bar"><button class="pa-btn ${liked?'liked':''}" onclick="toggleLike(${p.id},this)"><svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button><div style="color:#fff;font-weight:600">${likeCount} likes</div></div>
    </div>`;
  }catch(ex){w.innerHTML=`<div style="color:#fff;padding:40px;text-align:center">Error loading</div>`}
}
function closePostViewer(){
  const v=document.querySelector('#viewerWrap video');if(v)v.pause();
  $('viewPostModal').classList.remove('active');$('viewerWrap').innerHTML='';
}
async function addViewerComment(pid){
  const inp=$('vcInput-'+pid);if(!inp)return;
  const t=inp.value.trim();if(!t)return;
  inp.value='';
  try{ await api('comment',{method:'POST',body:{post_id:pid, text:t}}); openPostViewer(pid); }
  catch(e){toast('Error')}
}

// ============ SEARCH ============
async function renderSearch(){
  $('panel-search').innerHTML=`<div class="search-bar"><div class="search-input"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="Search" oninput="doSearch()"></div></div><div id="searchResults"></div>`;
  doSearch();
}
async function doSearch(){
  const q=$('searchInput').value.trim().toLowerCase();
  const r=$('searchResults');
  if(!q){
    r.innerHTML='<div class="spinner"></div>';
    try{
      const {posts} = await api('explore');
      if(!posts||posts.length===0){r.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text-2);font-size:14px">No reels to explore yet.</div>';return}
      r.innerHTML=`<div class="explore-grid">${posts.map(p=>`<div class="grid-item" onclick="openReels(${p.id})"><video src="${p.video_url}#t=0.1" preload="metadata" muted playsinline></video><div class="grid-play">▶</div></div>`).join('')}</div>`;
    }catch(e){r.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-2)">Error</div>'}
    return;
  }
  r.innerHTML='<div class="spinner"></div>';
  try{
    const {users, follows} = await api('search',{query:'q='+encodeURIComponent(q)});
    if(!users||users.length===0){r.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text-2);font-size:14px">No results found.</div>';return}
    const fm={};(follows||[]).forEach(f=>fm[f.following_id]=f.status);
    r.innerHTML=users.map(u=>{
      let btn='';
      if(u.id!==currentUser.id){
        const st=fm[u.id];
        if(st==='accepted')btn=`<button class="follow-btn following" onclick="event.stopPropagation();followBtnClick('${u.id}',this,${u.is_private})">Following</button>`;
        else if(st==='pending')btn=`<button class="follow-btn requested" onclick="event.stopPropagation();followBtnClick('${u.id}',this,${u.is_private})">Requested</button>`;
        else btn=`<button class="follow-btn" onclick="event.stopPropagation();followBtnClick('${u.id}',this,${u.is_private})">Follow</button>`;
      }
      return `<div class="user-row" onclick="viewUserProfile('${u.id}')"><img class="user-row-av" src="${u.avatar_url||DPFP}"><div class="user-row-info"><div class="user-row-name">${esc(u.username)} ${u.is_private?'🔒':''}</div><div class="user-row-bio">${esc(u.bio||'')}</div></div>${btn}</div>`;
    }).join('');
  }catch(e){r.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-2)">Search error</div>'}
}

// ============ PROFILE ============
async function renderProfile(uid){
  const el=$('panel-profile');el.innerHTML='<div class="spinner"></div>';
  try{
    const data = await api('profile',{query:'id='+uid});
    const pr = data.user;
    const posts = data.posts||[];
    const stats = data.counts;
    const pending = data.pending||0;
    el.innerHTML=`
      <div class="profile-header"><h2>${esc(pr.username)} ${pr.is_private?'🔒':''}</h2><button class="hbtn" onclick="openEditProfile()">☰</button></div>
      <div class="profile-info">
        <div class="profile-av"><img src="${pr.avatar_url||DPFP}" onerror="this.src='${DPFP}'"></div>
        <div class="profile-stats">
          <div class="pstat"><div class="pstat-num">${posts.length}</div><div class="pstat-label">posts</div></div>
          <div class="pstat" onclick="openConnections('followers',currentUser.id)"><div class="pstat-num">${stats.followers}</div><div class="pstat-label">followers</div></div>
          <div class="pstat" onclick="openConnections('following',currentUser.id)"><div class="pstat-num">${stats.following}</div><div class="pstat-label">following</div></div>
        </div>
      </div>
      <div class="profile-bio"><div class="bio-name">${esc(pr.username)}</div>${pr.bio?`<div>${linkify(pr.bio)}</div>`:''}</div>
      <div class="profile-btns">
        <button class="profile-btn" onclick="openEditProfile()">Edit profile</button>
        <button class="profile-btn" onclick="openUpload()">+ Upload</button>
        ${pending>0?`<button class="profile-btn primary" style="flex:0.6" onclick="openFollowRequests()">${pending}</button>`:''}
      </div>
      <div class="profile-tabs">
        <button class="ptab active" onclick="switchOwnTab('posts',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></button>
        <button class="ptab" onclick="switchOwnTab('reels',this)"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
      </div>
      <div class="grid" id="ownGrid"></div>`;
    vpPosts=posts;
    renderOwnGrid('posts');
    $('editUsername').value=pr.username;$('editBio').value=pr.bio||'';$('editPrivate').checked=pr.is_private===1||pr.is_private===true;
    $('editPfpPreview').src=pr.avatar_url||DPFP;
  }catch(e){el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-2)">Error</div>`}
}
function switchOwnTab(t,el){document.querySelectorAll('#panel-profile .ptab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderOwnGrid(t)}
function renderOwnGrid(t){
  const g=$('ownGrid');

// ============ VIEW OTHER PROFILE ============
async function viewUserProfile(uid){
  if(uid===currentUser.id){switchPanel('profile');return}
  currentViewingUserId=uid;
  const ov=document.createElement('div');
  ov.id='vpOverlay';
  ov.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:9500;overflow-y:auto';
  ov.innerHTML='<div class="spinner"></div>';
  document.body.appendChild(ov);
  try{
    const data = await api('profile',{query:'id='+uid});
    const prof = data.user;
    const stats = data.counts;
    const f = data.is_following, p = data.is_pending;
    const canView = data.can_view;
    const posts = data.posts||[];
    ov.innerHTML=`
      <div class="profile-header"><button class="hbtn" onclick="$('vpOverlay').remove()">←</button><h2>${esc(prof.username)}</h2><div style="width:32px"></div></div>
      <div class="profile-info">
        <div class="profile-av"><img src="${prof.avatar_url||DPFP}"></div>
        <div class="profile-stats">
          <div class="pstat"><div class="pstat-num">${posts.length}</div><div class="pstat-label">posts</div></div>
          <div class="pstat" onclick="openConnections('followers','${uid}')"><div class="pstat-num" id="vpFollowersCount">${stats.followers}</div><div class="pstat-label">followers</div></div>
          <div class="pstat" onclick="openConnections('following','${uid}')"><div class="pstat-num" id="vpFollowingCount">${stats.following}</div><div class="pstat-label">following</div></div>
        </div>
      </div>
      <div class="profile-bio"><div class="bio-name">${esc(prof.username)}</div>${prof.bio?`<div>${linkify(prof.bio)}</div>`:''}</div>
      ${!canView?'<div style="padding:16px;text-align:center;font-size:14px;color:var(--text-2)">🔒 This account is private</div>':''}
      <div class="profile-btns">
        <button class="profile-btn ${f||p?'':'primary'}" id="vpFollowBtn" onclick="followFromProfile()">${f?'Following':p?'Requested':'Follow'}</button>
        ${canView?'<button class="profile-btn" onclick="openChatWith(\''+uid+'\')">Message</button>':''}
      </div>
      <div class="profile-tabs"><button class="ptab active" onclick="vpSwitchTab(this,'posts','${uid}')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></button><button class="ptab" onclick="vpSwitchTab(this,'reels','${uid}')"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button></div>
      <div class="grid" id="vpGrid"></div>`;
    vpPosts=posts;renderVpGrid('posts');
  }catch(e){ov.innerHTML=`<div style="padding:40px;text-align:center">Error</div>`}
}
function vpSwitchTab(el,t,uid){document.querySelectorAll('#vpOverlay .ptab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderVpGrid(t)}
function renderVpGrid(t){
  const g=$('vpGrid');if(!g)return;
  if(t==='posts'){const l=vpPosts.filter(p=>p.image_url);if(!l.length){g.innerHTML='<div style="padding:50px 20px;text-align:center;color:var(--text-2);grid-column:1/-1;font-size:14px">No posts</div>';return}g.innerHTML=l.map(p=>`<div class="grid-item" onclick="$('vpOverlay').remove();openPostViewer(${p.id})"><img src="${p.image_url}"></div>`).join('')}

async function saveProfile(){
  const u=$('editUsername').value.trim(),b=$('editBio').value.trim(),p=$('editPrivate').checked;

  const btn=$('saveProfileBtn');btn.disabled=true;btn.textContent='Saving...';

// ============ CHAT ============
async function renderChat(){
  const el=$('panel-chat');el.innerHTML='<div class="spinner"></div>';
  try{
    const {rooms} = await api('rooms');
    const head=`<div class="chat-head"><button class="back" style="background:none;border:none;font-size:22px;cursor:pointer" onclick="switchPanel('feed')">←</button><h2>Messages</h2><svg onclick="$('chatActionModal').classList.add('active')" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div><div class="chat-tabs"><button class="chat-pill active" data-tab="primary" onclick="switchChatTab('primary')">Primary</button><button class="chat-pill" data-tab="general" onclick="switchChatTab('general')">Groups</button></div>`;
    allChatsCache = rooms.map(r=>({
      id: r.id, isGroup: Number(r.is_group)===1, name: r.display_name,
      preview: r.last_text || 'No messages', avatar: r.avatar || DPFP,
      online: Number(r.online)===1, otherUid: r.other_id
    }));
    el.innerHTML=head+'<div id="chatListBox"></div>';
    switchChatTab('primary');
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-2)">Error</div>'}
}
function switchChatTab(t,q=''){
  currentChatTab=t;
  document.querySelectorAll('.chat-pill').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  let f=t==='primary'?allChatsCache.filter(c=>!c.isGroup):allChatsCache.filter(c=>c.isGroup);
  if(q)f=f.filter(c=>c.name.toLowerCase().includes(q));
  const box=$('chatListBox');if(!box)return;
  if(!f.length){box.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--text-2);font-size:14px">No chats here.</div>';return}
  box.innerHTML=f.map(r=>`<button class="chat-item" onclick="openChatRoom(${r.id},${r.isGroup})"><div class="chat-item-av-wrap"><img class="chat-item-av" src="${r.avatar}">${r.online?'<div class="online-dot"></div>':''}</div><div class="chat-item-info"><div class="chat-item-name">${esc(r.name)}${r.isGroup?' <span style="font-size:10px;color:var(--blue);border:1px solid var(--blue);padding:1px 4px;border-radius:3px">GRP</span>':''}</div><div class="chat-item-preview">${linkify(r.preview)}</div></div></button>`).join('');
}
async function openChatRoom(id,isGroup){
  activeRoomId=id;
  const el=$('panel-chat');el.innerHTML='<div class="spinner"></div>';
  try{
    const {room, members} = await api('room',{query:'id='+id});
    activeAdmin=room.admin_id;
    activeMembers=members;
    let name=room.name||'Chat';
    let av=DPFP;
    if(!isGroup){
      const o=members.find(m=>m.user_id!==currentUser.id);
      if(o){name=o.username;if(o.avatar_url)av=o.avatar_url}
    } else if(room.avatar_url) av=room.avatar_url;
    el.innerHTML=`<div class="chat-room"><div class="chat-room-head"><button class="back" onclick="stopChatPoll();renderChat()">←</button><img src="${av}"><div style="flex:1"><h3>${esc(name)}</h3><div class="status">${isGroup?'Group chat':'Tap to view profile'}</div></div></div><div class="chat-msgs" id="chatMsgs"></div><div class="chat-input-fixed"><input id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send</button></div></div>`;
    lastMessageId=0;
    await loadMessages();
    subChat();
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-2)">Error</div>'}
}
async function loadMessages(){
  try{
    const {messages} = await api('messages',{query:`room_id=${activeRoomId}&since=0`});
    const box=$('chatMsgs');
    if(!messages||!messages.length){box.innerHTML='<div style="text-align:center;color:var(--text-2);font-size:13px;padding:20px">Say hi! 👋</div>';lastMessageId=0;return}
    box.innerHTML=messages.map(m=>{const s=m.user_id===currentUser.id;return`<div class="msg ${s?'self':''}"><div class="msg-bubble">${linkify(m.text||'')}</div></div>`}).join('');
    lastMessageId = messages[messages.length-1].id;
    requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);
  }catch(e){}
}
async function sendChat(){
  const i=$('chatInput');const t=i.value.trim();if(!t||!activeRoomId)return;
  i.value='';
  try{
    const {id} = await api('send-message',{method:'POST',body:{room_id:activeRoomId, text:t}});
    const box=$('chatMsgs');
    if(box){
      const d=document.createElement('div');d.className='msg self';
      d.innerHTML=`<div class="msg-bubble">${linkify(t)}</div>`;
      box.appendChild(d);
      lastMessageId=Math.max(lastMessageId, Number(id));
      box.scrollTop=box.scrollHeight;
    }
  }catch(e){toast('Error')}
}
function stopChatPoll(){if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null;}}
function subChat(){
  stopChatPoll();
  chatPollTimer=setInterval(async ()=>{
    try{
      const {messages} = await api('messages',{query:`room_id=${activeRoomId}&since=${lastMessageId}`});
      const box=$('chatMsgs');
      if(!box||!messages||!messages.length)return;
      messages.forEach(m=>{
        const s=m.user_id===currentUser.id;
        const d=document.createElement('div');
        d.className=`msg ${s?'self':''}`;
        d.innerHTML=`<div class="msg-bubble">${linkify(m.text||'')}</div>`;
        box.appendChild(d);
        lastMessageId=Math.max(lastMessageId, Number(m.id));
      });
      box.scrollTop=box.scrollHeight;
    }catch(e){}
  }, 2500);
}

// ============ REELS ============
async function openReels(startId){
  $('reelsOverlay').classList.add('active');
  $('reelsScroll').innerHTML='<div class="spinner" style="margin-top:40vh;border-color:rgba(255,255,255,0.2);border-top-color:#fff"></div>';
  try{
    const {reels} = await api('reels');
    if(!reels||!reels.length){closeReels();return}
    $('reelsScroll').innerHTML=reels.map(p=>{
      const liked=Number(p.liked_by_me)>0;
      return`<div class="reel" data-id="${p.id}"><video src="${p.video_url}" loop playsinline preload="metadata" muted onclick="this.paused?this.play():this.pause()"></video><div class="reel-overlay"><div><div class="reel-user" onclick="closeReels();viewUserProfile('${p.user_id}')"><img src="${p.avatar_url||DPFP}"><span>${esc(p.username)}</span></div><div class="reel-cap">${linkify(p.caption||'')}</div></div><div class="reel-actions"><button class="reel-action ${liked?'liked':''}" onclick="toggleLikeReel(${p.id},this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button></div></div></div>`;
    }).join('');
    setTimeout(()=>{
      if(startId){const t=document.querySelector(`.reel[data-id="${startId}"]`);if(t)t.scrollIntoView({behavior:'instant'})}
      if(reelsObserver)reelsObserver.disconnect();
      reelsObserver=new IntersectionObserver(en=>{en.forEach(e=>{const v=e.target.querySelector('video');if(e.isIntersecting)v.play().catch(()=>{});else{v.pause();v.currentTime=0}})},{threshold:0.6});
      document.querySelectorAll('.reel').forEach(r=>reelsObserver.observe(r));
    },100);
  }catch(e){closeReels()}
}
async function toggleLikeReel(pid,btn){
  btn.classList.toggle('liked');
  try{await api('like',{method:'POST',body:{post_id:pid}});}catch(e){toast('Error')}
}
function closeReels(){
  if(reelsObserver){reelsObserver.disconnect();reelsObserver=null}
  document.querySelectorAll('.reel video').forEach(v=>{v.pause();v.src=''});
  $('reelsScroll').innerHTML='';$('reelsOverlay').classList.remove('active');
}

// ============ UPLOAD ============
function openUpload(){
  upFile=null;upType=null;upFilter='none';
  if(upObjUrl){URL.revokeObjectURL(upObjUrl);upObjUrl=null}
  $('mediaInput').value='';
  $('uploadOverlay').classList.add('active');
  goStep(1);
}
function closeUpload(){
  if(upFile&&!confirm('Discard this post?'))return;
  upFile=null;upType=null;upFilter='none';
  if(upObjUrl){URL.revokeObjectURL(upObjUrl);upObjUrl=null}
  $('uploadOverlay').classList.remove('active');
  $('mediaInput').value='';
}
function goStep(n){
  ['upStep1','upStep2','upStep3'].forEach((id,i)=>{$(id).style.display=(i+1)===n?'flex':'none'});
  if(n===2&&upObjUrl){document.querySelectorAll('.filterThumb').forEach(t=>t.src=upObjUrl);}
  if(n===3&&upObjUrl){
    if(upType==='video'){$('shareThumb').style.display='none';$('shareThumbVid').style.display='block';$('shareThumbVid').src=upObjUrl;}
    else{$('shareThumb').style.display='block';$('shareThumbVid').style.display='none';$('shareThumb').src=upObjUrl;$('shareThumb').style.filter=upFilter;}
  }
}
function handleMediaSelect(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>50*1024*1024){toast('File too large (max 50MB)');return}
  upFile=f;
  upType=f.type.startsWith('video')?'video':'image';
  upObjUrl=URL.createObjectURL(f);
  if(upType==='image'){
    $('editImg').src=upObjUrl;$('editImg').style.display='block';
    $('editVid').style.display='none';$('editImg').style.filter='none';
    $('editToolbar').style.display='block';
  }else{
    $('editVid').src=upObjUrl;$('editVid').style.display='block';
    $('editImg').style.display='none';$('editToolbar').style.display='none';
  }
  document.querySelectorAll('.up-filter').forEach(f=>f.classList.remove('active'));
  document.querySelector('.up-filter[data-filter="none"]').classList.add('active');
  upFilter='none';
  goStep(2);
}
function applyFilter(el,css){
  upFilter=css;
  document.querySelectorAll('.up-filter').forEach(f=>f.classList.remove('active'));
  el.classList.add('active');
  if(upType==='image')$('editImg').style.filter=css;
}
function updateCaptionCount(){$('capCount').textContent=$('shareCaption').value.length}
async function sharePost(){
  if(!upFile){toast('No media');return}
  const caption=$('shareCaption').value.trim();
  const isTrial=$('shareTrial').checked;
  const btn=$('shareBtn');btn.textContent='Sharing...';btn.disabled=true;
  try{
    let finalFile=upFile;
    if(upType==='image'&&upFilter!=='none'){
      const img=new Image();img.src=upObjUrl;
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
      const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
      const ctx=cv.getContext('2d');ctx.filter=upFilter;ctx.drawImage(img,0,0);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
      finalFile=new File([blob],`filtered_${Date.now()}.jpg`,{type:'image/jpeg'});
    }
    const fd=new FormData();
    fd.append('file',finalFile);
    fd.append('kind','post');
    fd.append('caption',caption);
    fd.append('is_trial', String(isTrial?1:0));
    await api('upload',{method:'POST',body:fd,form:true});
    toast('Posted!');
    upFile=null;upType=null;upFilter='none';
    if(upObjUrl){URL.revokeObjectURL(upObjUrl);upObjUrl=null}
    $('shareCaption').value='';$('shareTrial').checked=false;$('capCount').textContent='0';
    $('uploadOverlay').classList.remove('active');
    switchPanel('feed');
    setTimeout(()=>renderFeed(),300);
  }catch(e){console.error(e);toast('Error: '+(e.message||'Upload failed'))}
  finally{btn.textContent='Share';btn.disabled=false}
}

// ============ BOOT ============
init();
</script>
