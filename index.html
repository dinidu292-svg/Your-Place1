<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Your Place - Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-color: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --primary: #818cf8;
    --primary-glow: rgba(129, 140, 248, 0.3);
    --accent: #f472b6;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --success: #10b981;
    --font: 'Outfit', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: var(--font); }
  body { background: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; }
  
  .app-wrapper { width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding-bottom: 80px; background: var(--bg-color); }
  @media(min-width: 768px) { 
    .app-wrapper { max-width: 650px; margin: 20px auto; min-height: calc(100vh - 40px); border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); background: var(--bg-color); overflow: hidden; } 
    .bottom-nav { max-width: 600px; width: calc(100% - 40px); }
    .chat-input-area { max-width: 600px; }
  }

  /* HEADER */
  .header { position: sticky; top: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); z-index: 100; }
  .logo { font-size: 24px; font-weight: 800; color: var(--text); cursor: pointer; letter-spacing: -0.5px; }
  .logo span { color: var(--primary); }
  
  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); height: 65px; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .nav-item { cursor: pointer; color: var(--text-muted); transition: all 0.2s; display: flex; justify-content: center; align-items: center; width: 50px; height: 50px; border-radius: 16px; }
  .nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active { color: var(--text); background: var(--surface-hover); }
  .nav-item.active svg { stroke: var(--primary); }

  /* PANELS */
  .panel { display: none; animation: fadeIn 0.3s; }
  .panel.active { display: block; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }

  /* STORIES */
  .stories-container { padding: 15px 20px; display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; }
  .stories-container::-webkit-scrollbar { display: none; }
  .story-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .story-ring { width: 70px; height: 70px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--primary), var(--accent)); position: relative; }
  .story-img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg-color); object-fit: cover; }
  .story-name { font-size: 12px; color: var(--text); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* POSTS */
  .post { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
  .post-header { display: flex; align-items: center; padding: 15px 20px; gap: 12px; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); padding: 2px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .post-user { font-weight: 600; font-size: 15px; }
  .post-time { font-size: 12px; color: var(--text-muted); }
  
  .post-media { width: 100%; max-height: 80vh; object-fit: contain; display: block; background: #000; }
  .post-image { width: 100%; max-height: 600px; object-fit: cover; display: block; }
  
  .post-actions { display: flex; padding: 15px 20px; gap: 20px; align-items: center; }
  .action-btn { cursor: pointer; color: var(--text); transition: 0.2s; display: flex; align-items: center; gap: 6px; }
  .action-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; }
  .action-btn.liked svg { fill: var(--accent); stroke: var(--accent); }
  
  .post-likes { padding: 0 20px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .post-caption { padding: 0 20px; font-size: 14px; line-height: 1.5; }
  .post-caption strong { font-weight: 600; margin-right: 6px; cursor: pointer; }

  .delete-btn { margin-left: auto; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }

  /* CHAT & GROUP CHAT */
  .chat-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 65px; background: var(--bg-color); z-index: 90; }
  .chat-room { display: flex; flex-direction: column; height: calc(100vh - 80px); height: calc(100dvh - 80px); position: relative; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 150px; display: flex; flex-direction: column; gap: 16px; }
  
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.self { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { padding: 14px 18px; border-radius: 22px; font-size: 15px; background: var(--surface); color: var(--text); border: 1px solid var(--border); word-wrap: break-word; }
  .msg.self .msg-bubble { background: var(--primary); color: #fff; border: none; border-bottom-right-radius: 4px; }
  .msg:not(.self) .msg-bubble { border-bottom-left-radius: 4px; }
  .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: right; }
  .msg-img { max-width: 220px; border-radius: 12px; margin-bottom: 6px; display: block; }
  .msg-sender { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 4px; cursor: pointer; }
  
  .chat-input-area { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; display: flex; flex-direction: column; border-radius: 24px; z-index: 99; }
  .chat-tools { display: flex; gap: 20px; padding: 5px 10px 10px; color: var(--text-muted); }
  .chat-tools svg { width: 24px; height: 24px; cursor: pointer; fill: none; stroke: currentColor; stroke-width: 2; }
  .chat-input-row { display: flex; gap: 10px; align-items: center; }
  .chat-input-row input { flex: 1; padding: 12px 18px; border-radius: 20px; border: none; outline: none; font-size: 15px; background: var(--bg-color); color: var(--text); }
  .chat-send-btn { background: var(--primary); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

  /* PROFILE */
  .profile-header { padding: 30px 20px; display: flex; align-items: center; gap: 20px; }
  .profile-avatar { width: 90px; height: 90px; border-radius: 50%; padding: 3px; background: var(--surface); border: 2px solid var(--primary); }
  .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .grid-posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 3px; }
  .grid-posts .grid-item { width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 4px; cursor: pointer; background: var(--surface); }
  .grid-posts img, .grid-posts video { width: 100%; height: 100%; object-fit: cover; }
  
  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 380px; border-radius: 20px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; }
  .input-group { margin-bottom: 15px; }
  .input-group input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-color); color: var(--text); outline: none; font-size: 15px; }
  .btn-primary { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; border: none; }
  
  .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 50px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* VIEW POST MODAL */
  #viewPostOverlay .modal-box { max-width: 500px; padding: 0; overflow: hidden; background: var(--bg-color); }
  .post-viewer-header { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid var(--border); }
  .post-viewer-media { width: 100%; max-height: 60vh; object-fit: contain; background: #000; display: block; }
  .post-viewer-actions { padding: 15px; }

  /* VIEW USER PROFILE MODAL */
  #viewProfileOverlay .modal-box { max-width: 450px; padding: 0; overflow: hidden; background: var(--bg-color); }
  .vp-cover { height: 120px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
  .vp-content { padding: 0 20px 20px; text-align: center; margin-top: -50px; }
  .vp-avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--bg-color); margin: 0 auto 10px; background: var(--surface); }
  .vp-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* GROUP / PRIVATE CHAT USER LIST */
  .group-user-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
  .group-user-item:hover { background: var(--surface-hover); }
  .group-user-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

  /* STORY VIEWER */
  .story-viewer { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; flex-direction: column; }
  .story-progress { display: flex; gap: 4px; padding: 15px; }
  .progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s linear; }
  .story-media { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ABOUT CREATOR */
  .creator-card { margin: 20px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
</style>
</head>
<body>

<div class="app-wrapper">
  <div class="header">
    <div class="logo" onclick="switchPanel('feed')">Your<span>Place</span></div>
  </div>

  <div class="panel active" id="panel-feed"></div>
  <div class="panel" id="panel-upload"></div>
  <div class="panel" id="panel-search"></div>
  <div class="panel" id="panel-chat"></div>
  <div class="panel" id="panel-profile"></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-panel="feed" onclick="switchPanel('feed')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
    <div class="nav-item" data-panel="search" onclick="switchPanel('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
    <div class="nav-item" data-panel="upload" onclick="switchPanel('upload')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
    <div class="nav-item" data-panel="chat" onclick="switchPanel('chat')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
    <div class="nav-item" data-panel="profile" onclick="switchPanel('profile')"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="groupChatOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">Create Group</h2>
    <div class="input-group"><input id="groupNameInput" type="text" placeholder="Group Name..."></div>
    <div class="input-group">
      <label style="color:var(--text-muted); font-size:12px; margin-bottom:5px; display:block;">Group Photo (Optional)</label>
      <input type="file" id="groupPicInput" accept="image/*" style="padding:10px; border:1px dashed var(--border); width:100%; color:var(--text); border-radius:12px;">
    </div>
    <div id="groupUserList" style="max-height:200px; overflow-y:auto; margin-bottom:20px; border:1px solid var(--border); border-radius:10px;"></div>
    <button class="btn-primary" onclick="submitGroupChat()" id="createGroupBtn">Create Group</button>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="$('groupChatOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="privateChatOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">New Private Chat</h2>
    <div id="privateChatUserList" style="max-height:300px; overflow-y:auto; margin-bottom:20px; border:1px solid var(--border); border-radius:10px;"></div>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); cursor:pointer;" onclick="$('privateChatOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="viewPostOverlay">
  <div class="modal-box">
    <button style="position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.5); border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; z-index:10;" onclick="$('viewPostOverlay').style.display='none'">×</button>
    <div id="viewPostContent"></div>
  </div>
</div>

<div class="modal-overlay" id="viewProfileOverlay">
  <div class="modal-box">
    <button style="position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.5); border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; z-index:10;" onclick="$('viewProfileOverlay').style.display='none'">×</button>
    <div class="vp-cover"></div>
    <div class="vp-content">
      <div class="vp-avatar"><img id="vpAvatar" src=""></div>
      <h2 id="vpUsername" style="font-size:22px; font-weight:700; margin-bottom:5px;"></h2>
      <div id="vpBio" style="font-size:14px; color:var(--text-muted); margin-bottom:20px;"></div>
      <button class="btn-primary" onclick="messageUser()">Message</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="authOverlay">
  <div class="modal-box">
    <h2 style="text-align:center; margin-bottom:25px; font-weight:800; color:var(--text); font-size:28px;" id="authTitle">Create Account</h2>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group"><input id="authEmail" type="email" placeholder="Email" required></div>
      <div class="input-group" id="usernameGroup"><input id="authUsername" type="text" placeholder="Username" required></div>
      <div class="input-group"><input id="authPassword" type="password" placeholder="Password" required></div>
      <div id="authError" style="color:var(--danger); font-size:13px; text-align:center; margin-bottom:15px; display:none;"></div>
      <button type="submit" class="btn-primary" id="authSubmitBtn">Sign Up</button>
    </form>
    <div style="text-align:center; margin-top:25px; font-size:14px; color:var(--text-muted);" id="authToggleBox">
      Already have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Log In</a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editProfileOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">Edit Profile</h2>
    <div class="input-group"><input type="file" id="avatarFileInput" accept="image/*" onchange="uploadAvatar(event)" style="padding:10px; border:1px dashed var(--border);"></div>
    <div class="input-group"><input id="editUsername" type="text" placeholder="Username"></div>
    <div class="input-group"><input id="editBio" type="text" placeholder="Bio"></div>
    <button class="btn-primary" onclick="saveProfile()">Save</button>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="$('editProfileOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="addStoryOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">Add Story</h2>
    <div class="input-group"><input type="file" id="storyFile" accept="image/*" style="padding:15px; border:1px dashed var(--border); border-radius:12px;"></div>
    <button class="btn-primary" onclick="uploadStory()" id="uploadStoryBtn">Upload</button>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="$('addStoryOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<div class="story-viewer" id="storyViewer">
  <div class="story-progress" id="storyProgress"></div>
  <div id="storyHeader" style="padding: 0 15px; color:white; font-weight:600; display:flex; align-items:center; gap:10px;"></div>
  <div style="flex:1; display:flex; justify-content:center; align-items:center; position:relative;" id="storyContent">
    <div style="position:absolute; left:0; top:0; bottom:0; width:50%; z-index:10;" onclick="prevStory()"></div>
    <div style="position:absolute; right:0; top:0; bottom:0; width:50%; z-index:10;" onclick="nextStory()"></div>
    <img id="storyMedia" class="story-media" src="">
  </div>
</div>

<div id="toast" style="position:fixed; top:20px; left:50%; transform:translate(-50%,-100px); background:var(--primary); color:#fff; padding:12px 24px; border-radius:30px; font-weight:700; z-index:99999; transition:0.3s; opacity:0; pointer-events:none; box-shadow:0 10px 20px rgba(0,0,0,0.5);"></div>

<script>
const SUPABASE_URL = 'https://ujbepvlzrdvcmxpmdsez.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqYmVwdmx6cmR2Y214cG1kc2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTQwNjUsImV4cCI6MjEwNzk5MDA2NX0.-XzEMlr2W_4uOi0QDKaR4KmrPRJGPmXoDz6SlOjfqvE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, authMode = 'signup';
let onlineUsersMap = new Map(), presenceChannel = null;
let activeRoomId = null, activeRoomMembers = [], chatChannel = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let currentStories = [], currentStoryIndex = 0, storyTimer = null;
let currentViewingUserId = null;

const DEFAULT_PFP = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231e293b'/><circle cx='50' cy='35' r='20' fill='%23818cf8'/><path d='M50 60 C25 60 15 75 15 100 L85 100 C85 75 75 60 50 60 Z' fill='%23818cf8'/></svg>";

function $(id){ return document.getElementById(id); }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function linkify(text) {
  let escaped = escapeHTML(text);
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return escaped.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:underline;">${url}</a>`);
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.transform='translate(-50%,0)'; t.style.opacity='1'; setTimeout(()=>{ t.style.transform='translate(-50%,-100px)'; t.style.opacity='0'; }, 2500); }

// NAVIGATION
function switchPanel(name){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.panel === name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $(`panel-${name}`).classList.add('active');
  
  if(name==='feed') renderFeed();
  if(name==='chat') renderChatList();
  if(name==='profile' && currentUser) renderProfile(currentUser.id);
  if(name==='search') renderSearch();
  if(name==='upload') renderUpload();
}

// ================= VIEW USER PROFILE (LINKING) =================
async function viewUserProfile(userId) {
  if(userId === currentUser.id) { switchPanel('profile'); return; }
  currentViewingUserId = userId;
  $('viewProfileOverlay').style.display = 'flex';
  $('vpUsername').textContent = 'Loading...';
  $('vpBio').textContent = '';
  $('vpAvatar').src = DEFAULT_PFP;
  
  const {data:prof} = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(prof) {
    $('vpUsername').textContent = prof.username;
    $('vpBio').textContent = prof.bio || 'No bio yet.';
    if(prof.avatar_url) $('vpAvatar').src = prof.avatar_url;
  }
}

async function messageUser() {
  if(!currentViewingUserId) return;
  $('viewProfileOverlay').style.display = 'none';
  try {
    const {data:myRooms} = await sb.from('room_members').select('room_id').eq('user_id', currentUser.id);
    const myRoomIds = (myRooms||[]).map(m => m.room_id);
    let existingRoomId = null;
    if(myRoomIds.length > 0) {

async function submitGroupChat() {

  const picFile = $('groupPicInput').files[0];
  const checkboxes = document.querySelectorAll('.group-checkbox:checked');
  if(checkboxes.length === 0) { toast('Select at least one friend'); return; }
  
  const btn = $('createGroupBtn'); btn.textContent = 'Creating...'; btn.disabled = true;
  const selectedUserIds = Array.from(checkboxes).map(cb => cb.value);
  
  try {
    let groupPicUrl = null;
    if(picFile) {
      const path = `groups/${Date.now()}.${picFile.name.split('.').pop()}`;
      const { error: uploadErr } = await sb.storage.from('chat_media').upload(path, picFile);
      if(!uploadErr) {

async function renderChatList() {

  try {
    const {data:memberships} = await sb.from('room_members').select('room_id').eq('user_id', currentUser.id);
    const roomIds = (memberships||[]).map(m => m.room_id);
    
    let roomsHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding:0 20px;">
        <h2 style="font-weight:700; font-size:24px;">Messages</h2>
        <div style="display:flex; gap:10px;">

          <button onclick="openGroupModal()" style="background:var(--primary); border:none; color:#fff; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:600;">+ Group</button>
        </div>
      </div>
    `;

    if(roomIds.length === 0) { 
      el.innerHTML = roomsHTML + `<div style="text-align:center; padding:40px; color:var(--text-muted);">No messages yet.</div>`; 
      return; 
    }

    const [roomsRes, membersRes, messagesRes] = await Promise.all([
      sb.from('chat_rooms').select('*').in('id', roomIds).order('created_at', {ascending:false}),
      sb.from('room_members').select('*').in('room_id', roomIds),
      sb.from('chat_messages').select('*').in('room_id', roomIds).order('created_at', {ascending:false})
    ]);
    const rooms = roomsRes.data || [], allMembers = membersRes.data || [], allMessages = messagesRes.data || [];

    roomsHTML += rooms.map(r => {
      const otherMember = !r.is_group ? allMembers.filter(m => m.room_id === r.id).find(m => m.user_id !== currentUser.id) : null;
      const isOnline = otherMember && onlineUsersMap.has(otherMember.user_id);
      const lastMsg = allMessages.find(m => m.room_id === r.id);
      let displayName = r.name || 'Chat'; if(!r.is_group && otherMember) displayName = otherMember.username;
      
      let preview = 'No messages';
      if(lastMsg) {
         if(lastMsg.text) preview = lastMsg.text;
         else if(lastMsg.image_url) preview = '📷 Photo';
         else if(lastMsg.audio_url) preview = '🎤 Voice';
      }

      // Display Avatar correctly
      let avatarHtml = `<div class="avatar" style="width:55px; height:55px;">`;
      if(r.is_group) {
         avatarHtml += r.avatar_url ? `<img src="${r.avatar_url}">` : `👥`;
      } else {
         avatarHtml += `<img src="${DEFAULT_PFP}">`;
      }
      avatarHtml += `</div>`;

      return `
      <div style="display:flex; align-items:center; gap:15px; padding:15px 20px; border-bottom:1px solid var(--border); cursor:pointer;">
        <div style="position:relative;" onclick="event.stopPropagation(); ${!r.is_group && otherMember ? `viewUserProfile('${otherMember.user_id}')` : ''}">
          ${avatarHtml}
          ${isOnline ? '<div style="position:absolute; bottom:0; right:0; width:14px; height:14px; background:var(--success); border-radius:50%; border:2px solid var(--bg-color);"></div>' : ''}
        </div>
        <div style="flex:1; min-width:0;" onclick="openChatRoom(${r.id}, ${r.is_group})">
          <div style="font-weight:600; font-size:16px;">${escapeHTML(displayName)}</div>
          <div style="font-size:14px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">${linkify(preview)}</div>

// ================= MESSAGE LOGIC =================
function toggleRecording() {
  if(isRecording) {
    mediaRecorder.stop(); isRecording = false; $('micBtn').style.color = 'var(--text-muted)';
  } else {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRecorder = new MediaRecorder(stream); audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const file = new File([audioBlob], `voice_${Date.now()}.webm`);
        await uploadChatMedia(file, 'audio');
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start(); isRecording = true; $('micBtn').style.color = 'var(--danger)';
    }).catch(() => alert('Microphone denied.'));
  }
}

async function uploadChatImage(e) {
  const file = e.target.files[0];
  if(file) await uploadChatMedia(file, 'image');
}

async function uploadChatMedia(file, type) {
  try {
    const path = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;
    const {error: uploadError} = await sb.storage.from('chat_media').upload(path, file);
    if(uploadError) throw uploadError;
    
    const {data: {publicUrl}} = sb.storage.from('chat_media').getPublicUrl(path);
    
    const msgData = { room_id: activeRoomId, user_id: currentUser.id, username: currentUser.username, text: '' };
    if(type === 'image') msgData.image_url = publicUrl;
    if(type === 'audio') msgData.audio_url = publicUrl;
    
    const {error: dbError} = await sb.from('chat_messages').insert([msgData]);
    if(dbError) throw dbError;
  } catch(ex) { toast('Upload failed: ' + ex.message); }
}

function renderMessageContent(m) {
  let content = '';
  if (m.text) {
    if (m.text.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
      content += `<img src="${m.text}" class="msg-img" style="max-width:100%; border-radius:10px;" alt="Image" />`;
    } else {
      content += `<div>${linkify(m.text)}</div>`;
    }
  }
  if (m.image_url) content += `<img src="${m.image_url}" class="msg-img" alt="Image" />`;
  if (m.audio_url) content += `<audio controls src="${m.audio_url}" style="max-width:200px; height:35px; filter: invert(1);"></audio>`;
  return content;
}

async function loadMessages() {
  const {data:msgs} = await sb.from('chat_messages').select('*').eq('room_id', activeRoomId).order('created_at');
  const box = $('chatMessagesBox');
  if(!msgs || msgs.length === 0) { box.innerHTML = `<p style="text-align:center; font-size:13px; margin-top:20px; color:var(--text-muted);">Say hi! 👋</p>`; return; }
  
  box.innerHTML = msgs.map(m => {
    const isSelf = m.user_id === currentUser.id;
    return `
    <div class="msg ${isSelf ? 'self' : ''}">
      <div>
        ${!isSelf ? `<div class="msg-sender" onclick="viewUserProfile('${m.user_id}')">${escapeHTML(m.username)}</div>` : ''}
        <div class="msg-bubble">${renderMessageContent(m)}</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      </div>
    </div>
  `}).join('');
  
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

async function sendChat() {
  const input = $('chatInput'); const text = input.value.trim();
  if(!text || !activeRoomId) return;
  input.value = '';
  await sb.from('chat_messages').insert([{room_id: activeRoomId, user_id: currentUser.id, username: currentUser.username, text}]);
  
  const box = $('chatMessagesBox');
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

function subscribeToMessages() {
  if(chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel('chat-'+activeRoomId).on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages', filter:`room_id=eq.${activeRoomId}`}, (payload) => {
    const m = payload.new;
    const box = $('chatMessagesBox');
    if(box) {
      const isSelf = m.user_id === currentUser.id;
      const div = document.createElement('div');
      div.className = `msg ${isSelf ? 'self' : ''}`;
      div.innerHTML = `
        <div>
          ${!isSelf ? `<div class="msg-sender" onclick="viewUserProfile('${m.user_id}')">${escapeHTML(m.username)}</div>` : ''}
          <div class="msg-bubble">${renderMessageContent(m)}</div>
          <div class="msg-time">${formatTime(m.created_at)}</div>
        </div>
      `;
      box.appendChild(div); 
      requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
    }
  }).subscribe();
}

function formatTime(dateStr) {
  if(!dateStr) return '';
  return new Date(dateStr).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}

function sharePost(postId) {
  const url = window.location.origin + '?post=' + postId;
  if (navigator.share) {
    navigator.share({ title: 'Your Place', text: 'Check out this post!', url: url }).then(() => toast('Shared!')).catch(() => fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function fallbackCopy(text) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast('Link copied! 🔗'));
  else {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "absolute"; ta.style.left = "-999999px";
    document.body.prepend(ta); ta.select();
    try { document.execCommand('copy'); toast('Link copied! 🔗'); } catch (err) { toast('Failed'); }
    ta.remove();
  }
}

async function toggleLike(postId, btn) {
  const isLiked = btn.classList.contains('liked');
  btn.classList.toggle('liked');
  const countEl = $(`likes-count-${postId}`);
  if(countEl) { let count = parseInt(countEl.textContent) || 0; countEl.textContent = isLiked ? `${count - 1} likes` : `${count + 1} likes`; }
  const modalCountEl = $(`modal-likes-count-${postId}`);
  if(modalCountEl) { let count = parseInt(modalCountEl.textContent) || 0; modalCountEl.textContent = isLiked ? `${count - 1} likes` : `${count + 1} likes`; }

  try {
    if(isLiked) await sb.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
    else await sb.from('likes').insert([{post_id: postId, user_id: currentUser.id}]);
  } catch(ex) { btn.classList.toggle('liked'); toast('Error liking post'); }
}

async function viewPost(postId) {
  $('viewPostOverlay').style.display = 'flex';
  $('viewPostContent').innerHTML = `<div class="spinner"></div>`;
  try {
    const {data:p} = await sb.from('posts').select('*').eq('id', postId).single();
    const {data:prof} = await sb.from('profiles').select('*').eq('id', p.user_id).maybeSingle();
    const isVideo = p.video_url && p.video_url.length > 0;
    const isOwn = p.user_id === currentUser.id;
    const {data:likes} = await sb.from('likes').select('*').eq('post_id', postId);
    const {data:comments} = await sb.from('comments').select('*').eq('post_id', postId).order('created_at');
    const hasLiked = likes?.some(l => l.user_id === currentUser?.id);

    $('viewPostContent').innerHTML = `
      <div class="post-viewer-header">
        <div class="avatar" onclick="viewUserProfile('${p.user_id}')"><img src="${prof?.avatar_url || DEFAULT_PFP}"></div>
        <div style="font-weight:600; font-size:15px;" onclick="viewUserProfile('${p.user_id}')">${escapeHTML(prof?.username || p.username)}</div>
        ${isOwn ? `<button class="delete-btn" onclick="deletePost(${p.id})" style="margin-left:auto;">🗑️ Delete</button>` : ''}
      </div>
      ${isVideo ? `<video src="${p.video_url}" controls playsinline class="post-viewer-media"></video>` : `<img src="${p.image_url}" class="post-viewer-media" onerror="this.src='${DEFAULT_PFP}'">`}
      <div class="post-viewer-actions">
        <div class="post-actions" style="padding: 0 0 10px 0;">
          <div class="action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike(${p.id}, this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
          <div class="action-btn" onclick="toggleCommentsInModal(${p.id})">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            <span style="font-size:14px; font-weight:600; margin-left:2px;">${comments?.length || 0}</span>
          </div>
        </div>
        <div class="post-likes" id="modal-likes-count-${p.id}" style="padding:0;">${likes?.length || 0} likes</div>
        <div class="post-caption" style="padding:5px 0;"><strong>${escapeHTML(prof?.username || p.username)}</strong> ${linkify(p.caption||'')}</div>
        <div id="modal-comments-${p.id}" style="margin-top:15px; display:none;">
          <div style="max-height:150px; overflow-y:auto; margin-bottom:10px;" id="modal-comment-list-${p.id}">
            ${(comments||[]).map(c => `<div style="font-size:13px; margin-bottom:8px; color:var(--text-muted);"><strong style="color:var(--text);">${escapeHTML(c.username)}</strong> ${linkify(c.text)}</div>`).join('')}
          </div>
          <div style="display:flex; gap:10px;">
             <input type="text" id="modal-cinput-${p.id}" placeholder="Add a comment..." style="flex:1; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:20px; padding:10px 15px; outline:none; color:var(--text); font-size:14px;" onkeydown="if(event.key==='Enter')addCommentInModal(${p.id})">
             <button style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;" onclick="addCommentInModal(${p.id})">Post</button>
          </div>
        </div>
      </div>
    `;
  } catch(ex) { $('viewPostContent').innerHTML = `<div style="padding:20px; text-align:center;">Error loading post.</div>`; }
}

function toggleCommentsInModal(postId) { const el = $(`modal-comments-${postId}`); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
async function addCommentInModal(postId) {
  const inputEl = $(`modal-cinput-${postId}`); const text = inputEl.value.trim(); if(!text) return;
  try {
    await sb.from('comments').insert([{post_id: postId, user_id: currentUser.id, username: currentUser.username, text}]);
    inputEl.value = ''; viewPost(postId);
  } catch(ex) { toast('Error adding comment'); }
}
async function deletePost(postId) {
  if(!confirm('Delete this post?')) return;
  await sb.from('posts').delete().eq('id', postId).eq('user_id', currentUser.id);
  $('viewPostOverlay').style.display = 'none';
  renderFeed();
}

// ================= AUTH & OTHER PANELS =================
function showAuthGate() { $('authOverlay').style.display = 'flex'; document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'none'); }
function toggleAuthMode(e) {
  if(e) e.preventDefault();
  authMode = authMode === 'login' ? 'signup' : 'login';
  const isLogin = authMode === 'login';
  $('usernameGroup').style.display = isLogin ? 'none' : 'block';
  $('authTitle').textContent = isLogin ? 'Welcome Back' : 'Create Account';
  $('authSubmitBtn').textContent = isLogin ? 'Log In' : 'Sign Up';
  $('authToggleBox').innerHTML = isLogin ? `Don't have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign Up</a>` : `Have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Log In</a>`;
}

async function handleAuth(e) {
  e.preventDefault();
  const btn = $('authSubmitBtn'), err = $('authError');
  err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Wait...';
  try {
    const email = $('authEmail').value.trim(), password = $('authPassword').value, username = $('authUsername').value.trim();
    if(authMode === 'login') {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if(error) throw error;
      let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
      currentUser = { id: data.user.id, username: prof?.username || email.split('@')[0] };
    } else {
      const {data, error} = await sb.auth.signUp({email, password, options:{data:{username}}});
      if(error) throw error;
      if(data.session) { currentUser = { id: data.user.id, username }; await sb.from('profiles').insert([{id: data.user.id, username}]); }
      else throw new Error('Check email to confirm.');
    }
    $('authOverlay').style.display = 'none'; document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'auto'); initApp(); 
  } catch(ex) { err.textContent = ex.message; err.style.display = 'block'; } 
  finally { btn.disabled = false; btn.textContent = authMode === 'login' ? 'Log In' : 'Sign Up'; }
}

function renderUpload() {
  $('panel-upload').innerHTML = `
    <div style="padding: 20px;">
      <h2 style="margin-bottom: 20px; font-size: 24px;">Create Post</h2>
      <input type="file" id="postFile" accept="image/*,video/*" style="display:none;" onchange="previewPost(event)">
      <div class="upload-card" onclick="$('postFile').click()" style="margin:0 0 20px 0; border: 1px dashed var(--border); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer;">
        <div style="font-size: 40px; color: var(--primary);">📸</div>
        <div style="font-weight: 600; margin-top:10px;">Tap to select Image / Video</div>
      </div>
      <img id="postPreview" class="preview-img" style="width:100%; border-radius:12px; margin-bottom:20px; display:none;">
      <textarea id="postCaption" rows="3" placeholder="Write a caption..." style="width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px; color:var(--text); outline:none; font-family:inherit; margin-bottom:20px;"></textarea>
      <button class="btn-primary" id="postBtn" onclick="createPost()">Share Post</button>
    </div>
  `;
}
let postFileObj = null;
function previewPost(e) {
  const file = e.target.files[0]; if(!file) return; postFileObj = file;
  const img = $('postPreview'); img.src = URL.createObjectURL(file); img.style.display = 'block';
}
async function createPost() {
  const caption = $('postCaption').value.trim(); if(!postFileObj) { toast('Select media'); return; }
  const btn = $('postBtn'); btn.textContent = 'Uploading...'; btn.disabled = true;
  try {
    const isVideo = postFileObj.type.startsWith('video'); const bucket = isVideo ? 'videos' : 'posts';
    const path = `${currentUser.id}/${Date.now()}.${postFileObj.name.split('.').pop()}`;
    const {error: uploadErr} = await sb.storage.from(bucket).upload(path, postFileObj); if(uploadErr) throw uploadErr;
    const {data: {publicUrl}} = sb.storage.from(bucket).getPublicUrl(path);
    await sb.from('posts').insert([{user_id: currentUser.id, username: currentUser.username, caption: caption || '', image_url: isVideo ? null : publicUrl, video_url: isVideo ? publicUrl : null}]);
    toast('Posted!'); postFileObj = null; switchPanel('feed');
  } catch(ex) { toast('Error: ' + ex.message); } finally { btn.textContent = 'Share Post'; btn.disabled = false; }
}

async function renderProfile(userId) {
  const el = $('panel-profile'); el.innerHTML = `<div class="spinner"></div>`;
  const {data:prof} = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(!prof) prof = { username: currentUser.username, avatar_url: null, bio: '' };
  const {data:posts} = await sb.from('posts').select('*').eq('user_id', userId).order('created_at', {ascending:false});
  const isMe = userId === currentUser.id;
  
  el.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar"><img src="${prof.avatar_url || DEFAULT_PFP}" onerror="this.src='${DEFAULT_PFP}'"></div>
      <div style="flex:1;">
        <h2 style="font-size:24px; font-weight:700; margin-bottom:15px;">${escapeHTML(prof.username)}</h2>
        ${isMe ? `<button style="background:var(--surface); border:1px solid var(--border); padding:10px 24px; border-radius:12px; font-weight:600; cursor:pointer; color:var(--text);" onclick="$('editProfileOverlay').style.display='flex'">Edit Profile</button>` : ''}
      </div>
    </div>
    <div style="padding:0 20px 20px; font-size:15px; color:var(--text-muted); line-height:1.5;">
      <b style="color:var(--text);">${escapeHTML(prof.username)}</b><br>${linkify(prof.bio || '')}
    </div>
    <div class="grid-posts">
      ${(posts||[]).map(p => `<div class="grid-item" onclick="viewPost(${p.id})">${p.image_url ? `<img src="${p.image_url}" onerror="this.src='${DEFAULT_PFP}'">` : `<video src="${p.video_url}"></video>`}</div>`).join('')}
    </div>
    ${isMe ? `<div class="creator-card"><h3 style="color:var(--primary); margin-bottom:10px;">About The Creator</h3><p style="font-size:14px; color:var(--text-muted);"><b>Dinidu Wijesinghe</b><br>"Hi there! I'm Dinidu, the creator behind Your Place 2026. I built this platform with a simple vision: to create a safe, fun, and fast space for friends to connect, share moments, and chat without distractions. Thank you for being a part of this journey. Let's build a great community together!"</p></div>` : ''}
  `;
  $('editUsername').value = prof.username; $('editBio').value = prof.bio || '';
}

async function saveProfile() { await sb.from('profiles').update({username: $('editUsername').value.trim(), bio: $('editBio').value.trim()}).eq('id', currentUser.id); $('editProfileOverlay').style.display = 'none'; renderProfile(currentUser.id); }
async function uploadAvatar(e) { const file = e.target.files[0]; if(!file) return; const path = `${currentUser.id}/avatar.jpg`; await sb.storage.from('avatars').upload(path, file, {upsert: true}); const {data: {publicUrl}} = sb.storage.from('avatars').getPublicUrl(path); await sb.from('profiles').update({avatar_url: publicUrl}).eq('id', currentUser.id); renderProfile(currentUser.id); }

// STORIES
async function openStoryViewer(userId) {
  const {data:stories} = await sb.from('stories').select('*').eq('user_id', userId).order('created_at', {ascending:true});
  if(!stories || stories.length === 0) return;
  currentStories = stories; currentStoryIndex = 0;
  $('storyViewer').style.display = 'flex'; loadStory(currentStoryIndex);
}
function loadStory(index) {
  if(index >= currentStories.length) { closeStoryViewer(); return; }
  const story = currentStories[index]; $('storyMedia').src = story.media_url;
  $('storyHeader').innerHTML = `<div class="avatar" style="width:32px; height:32px;"><img src="${DEFAULT_PFP}"></div> ${escapeHTML(story.username)}`;
  let progressHTML = '';
  for(let i=0; i<currentStories.length; i++) progressHTML += `<div class="progress-segment"><div class="progress-fill" id="prog-${i}" style="width:${i < index ? '100%' : '0%'};"></div></div>`;
  $('storyProgress').innerHTML = progressHTML;
  const fill = $(`prog-${index}`); let width = 0; clearInterval(storyTimer);
  storyTimer = setInterval(() => { width += 2; if(width >= 100) { clearInterval(storyTimer); nextStory(); } else { fill.style.width = width + '%'; } }, 100); 
}
function nextStory() { clearInterval(storyTimer); currentStoryIndex++; loadStory(currentStoryIndex); }
function prevStory() { clearInterval(storyTimer); if(currentStoryIndex > 0) { currentStoryIndex--; loadStory(currentStoryIndex); } }
function closeStoryViewer() { $('storyViewer').style.display = 'none'; clearInterval(storyTimer); }
async function uploadStory() {
  const file = $('storyFile').files[0]; if(!file) { toast('Select a photo'); return; }
  const btn = $('uploadStoryBtn'); btn.textContent = 'Uploading...'; btn.disabled = true;
  try {
    const path = `${currentUser.id}/story_${Date.now()}.jpg`; const {error} = await sb.storage.from('stories').upload(path, file); if(error) throw error;
    const {data: {publicUrl}} = sb.storage.from('stories').getPublicUrl(path);
    await sb.from('stories').insert([{user_id: currentUser.id, username: currentUser.username, media_url: publicUrl}]);
    toast('Story posted!'); $('addStoryOverlay').style.display = 'none'; renderFeed();
  } catch(ex) { toast('Error: ' + ex.message); } finally { btn.textContent = 'Upload'; btn.disabled = false; }
}

// SEARCH & OTHER PROFILE
async function renderSearch() {
  $('panel-search').innerHTML = `<div style="padding:20px;"><input type="text" id="searchInput" placeholder="Search users..." oninput="doSearch()" style="width:100%; padding:16px; border:1px solid var(--border); border-radius:15px; background:var(--surface); color:var(--text); outline:none; font-size:15px;"><div id="searchResults" style="margin-top:20px;"></div></div>`;
  doSearch();
}
async function doSearch() {
  const q = $('searchInput').value.toLowerCase(), resEl = $('searchResults');
  let query = sb.from('profiles').select('*').limit(20); if(q) query = query.ilike('username', `%${q}%`);
  const {data:users} = await query;
  resEl.innerHTML = (users||[]).map(u => `<div style="display:flex; align-items:center; gap:15px; padding:15px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="viewUserProfile('${u.id}')"><div class="avatar"><img src="${u.avatar_url || DEFAULT_PFP}"></div><div style="font-weight:600; font-size:15px;">${escapeHTML(u.username)}</div></div>`).join('');
}

// INIT
async function initApp() { renderFeed(); subscribePresence(); }
async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if(session) {
    let {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    currentUser = { id: session.user.id, username: prof?.username || session.user.email.split('@')[0] };
    document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'auto'); initApp();
  } else { showAuthGate(); }
}
function subscribePresence() {
  if(presenceChannel) return;
  presenceChannel = sb.channel('online-users', { config: { presence: { key: currentUser.id } } });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    onlineUsersMap.clear(); const state = presenceChannel.presenceState();
    for(const id in state) { if(state[id].length > 0) onlineUsersMap.set(id, state[id][0].username); }
    if($('panel-chat').classList.contains('active') && !activeRoomId) { renderChatList(); }
  });
  presenceChannel.subscribe(async (status) => { if(status === 'SUBSCRIBED') await presenceChannel.track({ username: currentUser.username }); });
}
function timeAgo(dateStr){ const diff = Math.floor((new Date() - new Date(dateStr))/1000); if(diff < 60) return 'just now'; if(diff < 3600) return Math.floor(diff/60)+'m ago'; if(diff < 86400) return Math.floor(diff/3600)+'h ago'; return Math.floor(diff/86400)+'d ago'; }

init();
</script>
