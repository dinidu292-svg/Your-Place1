<style>
/* ... (ඔබගේ පෙර CSS සියල්ල මෙතැනට එයි, මම කෙටි කිරීම සඳහා මෙතැන නවතිනවා, පහළින් ඇති සම්පූර්ණ කෝඩ් එක භාවිතා කරන්න) ... */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Outfit',-apple-system,sans-serif}
:root{
  --bg:#0F172A; --bg-alt:#1E293B; --surface:#1E293B; --surface-2:#334155;
  --border:rgba(255,255,255,0.06); --border-light:rgba(255,255,255,0.03);
  --text:#F8FAFC; --text-2:#94A3B8; --text-3:#64748B;
  --accent:#38BDF8; --accent-2:#818CF8; --accent-3:#F472B6;
  --success:#10B981; --danger:#F43F5E; --warning:#F59E0B;
  --grad:linear-gradient(135deg,#38BDF8 0%,#818CF8 100%);
  --grad-2:linear-gradient(135deg,#F472B6,#818CF8);
  --glow:0 0 24px rgba(56,189,248,0.25);
  --shadow:0 10px 40px -10px rgba(0,0,0,0.6);
  --radius:24px;
}
/* ... (CSS සම්පූර්ණයෙන්ම එලෙසම තබන්න) ... */
/* මම මෙතැන CSS සම්පූර්ණයෙන් ලියා නැත, ඔබගේ පැරණි CSS එකම මෙහි භාවිතා කරන්න. 
   නමුත් පහත JS කෝඩ් එක සම්පූර්ණයෙන්ම අලුත්. */

/* Reels Landscape Fix */
.reel{display:flex;align-items:center;justify-content:center;background:#000}
.reel video{width:100%;height:100%;object-fit:contain;object-position:center}
.reel-overlay{pointer-events:none;padding-bottom:70px}
.reel-overlay>*{pointer-events:auto}

<!-- ... (Upload Overlay, Auth Overlay, Modals - ඔබගේ පැරණි HTML එකම) ... -->
<div class="upload-overlay" id="uploadOverlay">
  <div id="upStep1" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <header class="up-header"><button class="up-btn" onclick="closeUpload()">Cancel</button><h2 id="upTitle">New post</h2><div style="width:60px"></div></header>
    <div class="up-select-body">
      <div class="up-select-icon">✨</div>
      <div class="up-select-title">Share a moment</div>

      <button class="up-select-btn" onclick="$('mediaInput').click()">Choose file</button>
    </div>
  </div>
  <div id="upStep2" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <header class="up-header"><button class="up-btn" onclick="goStep(1)">← Back</button><h2>Edit</h2><button class="up-btn primary ready" onclick="goStep(3)">Next →</button></header>
    <div class="up-edit-body">
      <div class="up-edit-preview"><img id="editImg" style="display:none"><video id="editVid" style="display:none" controls playsinline muted></video></div>
      <div class="up-edit-toolbar" id="editToolbar">
        <div class="up-filter-row">

          <button class="up-filter" data-filter="grayscale(100%)" onclick="applyFilter(this,'grayscale(100%)')"><img class="filterThumb" style="filter:grayscale(100%)"><span>Mono</span></button>

    </div>

    <header class="up-header"><button class="up-btn" onclick="goStep(2)">← Back</button><h2>New post</h2><button class="up-btn primary ready" id="shareBtn" onclick="sharePost()">Share</button></header>

        <img id="shareThumb" class="up-share-thumb" style="display:block">

<div id="authOverlay">

      <input class="auth-input" id="authPassword" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">

      <input class="auth-input" id="authOtp" type="text" placeholder="Enter 6-digit code" maxlength="6" style="display:none; text-align:center; letter-spacing: 5px; font-size: 20px;">

      <div class="auth-success" id="authSuccess" style="display:none"></div>
      
      <button class="auth-btn" id="authBtn" onclick="handleAuth()">Sign In</button>
      <button class="auth-btn" id="verifyOtpBtn" onclick="verifyOTP()" style="display:none">Verify Code</button>
    </div>

<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(m){const t=$('toast');t.textContent=m;t.style.transform='translateX(-50%) translateY(0)';t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.transform='translateX(-50%) translateY(100px)';t.style.opacity='0'},2800)}

// 🚨 CRITICAL FIX: Safe Insert Helper (මෙය නිසා .catch() crash එක වළකී)
async function safeInsert(table, rows){
  try{
    const { error } = await sb.from(table).insert(rows);
    if(error) console.warn('[insert '+table+']', error.message);
    return { error };
  }catch(e){
    console.warn('[insert '+table+']', e.message);
    return { error: e };
  }
}

function viewMediaFull(url, isVideo = false){
  if(!url)return;
  const div=document.createElement('div');
  div.className='img-fullscreen';
  const mediaHtml = isVideo 
    ? `<video src="${url}" controls autoplay style="max-width:100%;max-height:100%;object-fit:contain"></video>` 
    : `<img src="${url}" onclick="event.stopPropagation()">`;
  div.innerHTML=`<button class="img-fullscreen-close" onclick="event.stopPropagation();this.parentElement.remove()">×</button>${mediaHtml}`;
  div.onclick=()=>div.remove();
  document.body.appendChild(div);
}

/* =====================================================================
   AUTH WITH OTP
===================================================================== */
function showAuth(){$('authOverlay').classList.add('active')}
function setAuthMode(m){
  authMode=m;const li=m==='login';
  $('authUsername').style.display=li?'none':'block';
  $('authPassword').style.display=li?'block':'none'; // OTP system uses email only
  $('authOtp').style.display='none';
  $('authBtn').style.display='block';
  $('verifyOtpBtn').style.display='none';
  
  $('authSub').textContent=li?'Welcome back. Sign in to your universe.':'Join Your Place. Start your journey.';
  $('authBtn').textContent=li?'Sign In':'Send Code';
  $('authToggle').innerHTML=li?`New here? <span onclick="toggleAuthMode()">Create account</span>`:`Have an account? <span onclick="toggleAuthMode()">Sign in</span>`;
  $('authError').style.display='none';$('authSuccess').style.display='none';
}
function toggleAuthMode(){setAuthMode(authMode==='login'?'signup':'login')}

async function handleAuth(){
  if(authBusy)return;
  const email=$('authEmail').value.trim().toLowerCase();
  
  if(!email) return toast('Enter your email');

  authBusy=true;const b=$('authBtn');b.disabled=true;b.textContent='Sending...';
  $('authError').style.display='none';$('authSuccess').style.display='none';

  try{
    // OTP යැවීම (Sign In / Sign Up දෙකටම)
    const { data, error } = await sb.auth.signInWithOtp({
      email: email,
      options: { shouldCreateUser: true }
    });
    if(error) throw error;

    // OTP UI එක පෙන්වීම
    $('authOtp').style.display='block';
    $('authBtn').style.display='none';
    $('verifyOtpBtn').style.display='block';
    $('authSub').textContent=`Code sent to ${email}`;
    toast('Verification code sent to your email!');

  }catch(err){
    let msg=err.message||'Error';
    $('authError').innerHTML=msg;$('authError').style.display='block';
  }finally{
    authBusy=false;b.disabled=false;b.textContent=authMode==='login'?'Sign In':'Send Code';
  }
}

async function verifyOTP(){
  if(authBusy)return;
  const email=$('authEmail').value.trim().toLowerCase();
  const token=$('authOtp').value.trim();
  if(!token || token.length<6) return toast('Enter the 6-digit code');

  authBusy=true;const b=$('verifyOtpBtn');b.disabled=true;b.textContent='Verifying...';
  $('authError').style.display='none';

  try{
    const { data, error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if(error) throw error;

    // Logged In Successfully
    const {data:prof} = await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();
    currentUser={id:data.user.id,username:prof?.username||email.split('@')[0],avatar_url:prof?.avatar_url};
    
    $('authOverlay').classList.remove('active');
    initApp();
    toast('Welcome! ✨');
  }catch(err){
    $('authError').textContent=err.message||'Invalid code';
    $('authError').style.display='block';
  }finally{
    authBusy=false;b.disabled=false;b.textContent='Verify Code';
  }
}

async function init(){
  setAuthMode('login');showAuth();buildEmojiPicker();
  try{
    const {data}=await sb.auth.getSession();if(!data?.session)return;
    const {data:prof}=await sb.from('profiles').select('*').eq('id',data.session.user.id).maybeSingle();
    currentUser={id:data.session.user.id,username:prof?.username||'User',avatar_url:prof?.avatar_url};
    $('authOverlay').classList.remove('active');initApp();
    
    const urlParams = new URLSearchParams(window.location.search);

async function initApp(){
  $('navPfp').src=currentUser.avatar_url||DPFP;
  renderFeed();subscribePresence();pollNotifications();
}

function subscribePresence(){
  if(presenceCh)return;
  presenceCh=sb.channel('online-users',{config:{presence:{key:currentUser.id}}});
  presenceCh.on('presence',{event:'sync'},()=>{onlineUsers.clear();const s=presenceCh.presenceState();for(const id in s)if(s[id].length)onlineUsers.set(id,s[id][0].username);})
  .subscribe(async st=>{if(st==='SUBSCRIBED')await presenceCh.track({username:currentUser.username})});
}

function updateTopNav(name){
  const nav=$('navLeft');
  if(name==='feed'){nav.innerHTML=`<div class="logo" onclick="switchPanel('feed')">Your Place</div>`;}
  else{
    const titles={search:'Explore',profile:'Profile',chat:'Messages',notifications:'Notifications'};
    nav.innerHTML=`<button class="back-btn" onclick="switchPanel('feed')"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><div class="page-title">${titles[name]||''}</div>`;
  }
  $('topNav').style.display='flex';
}

function switchPanel(name){
  closeReels();hideEmojiPicker();stopChatPoll();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const el=$('panel-'+name);if(el)el.classList.add('active');
  updateTopNav(name);
  $('bottomNav').style.display='flex';
  if(name==='feed')renderFeed();
  if(name==='profile'&&currentUser)renderProfile(currentUser.id);
  if(name==='search')renderSearch();
  if(name==='chat')renderChat();
  if(name==='notifications')renderNotifications();
}

/* =====================================================================
   FOLLOWS
===================================================================== */
async function getStats(uid){try{const[a,b]=await Promise.all([sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',uid).eq('status','accepted'),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',uid).eq('status','accepted')]);return{followers:a.count||0,following:b.count||0}}catch(e){return{followers:0,following:0}}}
async function isFollowing(a,b){try{const{data}=await sb.from('follows').select('id').eq('follower_id',a).eq('following_id',b).eq('status','accepted').maybeSingle();return!!data}catch(e){return false}}
async function isPending(a,b){try{const{data}=await sb.from('follows').select('id').eq('follower_id',a).eq('following_id',b).eq('status','pending').maybeSingle();return!!data}catch(e){return false}}

async function toggleFollow(target,isPriv){
  try{
    const f=await isFollowing(currentUser.id,target),p=await isPending(currentUser.id,target);
    if(f||p){await sb.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',target);return'unfollowed'}
    const status=isPriv?'pending':'accepted';
    await sb.from('follows').insert([{follower_id:currentUser.id,following_id:target,status}]);
    await safeInsert('notifications',[{user_id:target,actor_id:currentUser.id,actor_username:currentUser.username,actor_avatar:currentUser.avatar_url,type:isPriv?'request':'follow'}]);
    return status==='pending'?'requested':'following';
  }catch(e){toast('Error: '+e.message);return null}
}

async function followBtnClick(target,btn,isPriv){
  btn.disabled=true;const r=await toggleFollow(target,isPriv);
  if(r==='following'){btn.textContent='Following';btn.className='follow-btn following'}
  else if(r==='unfollowed'){btn.textContent='Follow';btn.className='follow-btn'}
  else if(r==='requested'){btn.textContent='Requested';btn.className='follow-btn requested'}
  btn.disabled=false;
}

async function followFromProfile(){
  if(!currentViewingUserId)return;
  const b=$('vpFollowBtn');b.disabled=true;
  const{data:p}=await sb.from('profiles').select('is_private').eq('id',currentViewingUserId).single();
  const r=await toggleFollow(currentViewingUserId,p?.is_private===true);
  if(r==='following'){b.textContent='Following';b.className='profile-btn'}
  else if(r==='unfollowed'){b.textContent='Follow';b.className='profile-btn primary'}
  else if(r==='requested'){b.textContent='Requested';b.className='profile-btn'}
  const s=await getStats(currentViewingUserId);$('vpFollowersCount').textContent=s.followers;$('vpFollowingCount').textContent=s.following;b.disabled=false;
}

/* =====================================================================
   FEED (Home = Posts only)
===================================================================== */
async function renderFeed(){
  const el=$('panel-feed');el.innerHTML='<div class="spinner"></div>';
  try{
    const cut=new Date(Date.now()-24*60*60*1000).toISOString();
    const{data:stories}=await sb.from('stories').select('*').gte('created_at',cut).order('created_at',{ascending:false});
    
    // 🚨 FIX: Home එකේ Posts විතරක් (video_url null විය යුතුයි)
    const{data:posts}=await sb.from('posts').select('*').is('video_url', null).order('created_at',{ascending:false}).limit(50);
    
    const uids=[...new Set((posts||[]).map(p=>p.user_id))];
    const{data:profs}=uids.length?await sb.from('profiles').select('id,username,avatar_url,is_private').in('id',uids):{data:[]};
    const pm={};(profs||[]).forEach(p=>pm[p.id]=p);
    const{data:flw}=await sb.from('follows').select('following_id').eq('follower_id',currentUser.id).eq('status','accepted');
    const fid=(flw||[]).map(f=>f.following_id);
    
    // 🚨 FIX: Private Posts (එකවරක් පෙන්වා ඉවත් වීම)
    // මේ සඳහා post_views වගුවක් අවශ්‍ය වේ (පහළින් SQL එක ඇත)
    const pids=(posts||[]).map(p=>p.id);
    let seenPids = new Set();
    if(pids.length>0){
       const {data:views} = await sb.from('post_views').select('post_id').eq('user_id', currentUser.id).in('post_id', pids);
       if(views) views.forEach(v => seenPids.add(v.post_id));
    }

    const vis=(posts||[]).filter(p=>{
      if(p.user_id===currentUser.id)return true;
      const pr=pm[p.user_id];
      if(!pr)return false;
      if(pr.is_private===true || pr.is_private===1 || pr.is_private==='true'){
        if(!fid.includes(p.user_id))return false;
        if(seenPids.has(p.id)) return false; // දැනටමත් එකවරක් බලා ඇත
      }
      return true;
    });

    // Mark as seen (Background එකේ)
    const newViews = vis.filter(p => p.user_id !== currentUser.id && pm[p.user_id]?.is_private).map(p => ({post_id:p.id, user_id:currentUser.id}));
    if(newViews.length > 0) safeInsert('post_views', newViews);

    const likes=pids.length?(await sb.from('likes').select('*').in('post_id',pids)).data||[]:[];
    const comments=pids.length?(await sb.from('comments').select('*').in('post_id',pids)).data||[]:[];

    let storiesHtml=`<div class="stories"><button class="story" onclick="openUploadStory()"><div class="story-ring add">+</div><div class="story-name">Your story</div></button>`;
    const seen=new Set();
    (stories||[]).forEach(s=>{
      if(seen.has(s.user_id))return;seen.add(s.user_id);
      const p=pm[s.user_id]||{username:s.username,avatar_url:null,is_private:false};
      if(s.user_id!==currentUser.id && (p.is_private===true||p.is_private===1))return;
      storiesHtml+=`<button class="story" onclick="viewStory('${esc(s.media_url||'')}','${s.media_type||'image'}')"><div class="story-ring"><img src="${p.avatar_url||DPFP}"></div><div class="story-name">${esc(p.username)}</div></button>`;
    });
    storiesHtml+='</div>';

    if(vis.length===0){
      el.innerHTML=storiesHtml+`<div class="empty-state"><div class="em">🌌</div><h3>Your universe awaits</h3><p>Share your first moment or follow others</p><button onclick="openUpload()">Share your first post</button></div>`;return;
    }

    el.innerHTML=storiesHtml+vis.map(p=>{
      const pr=pm[p.user_id]||{username:p.username,avatar_url:null};
      const pl=likes.filter(l=>l.post_id===p.id),pc=comments.filter(c=>c.post_id===p.id);
      const liked=pl.some(l=>l.user_id===currentUser?.id);
      
      const mediaHtml = `<img src="${p.image_url}" onerror="this.src='${DPFP}'">`;

      return `<div class="post" data-post="${p.id}">
        <div class="post-head" onclick="viewUserProfile('${p.user_id}')">
          <div class="post-avatar"><img src="${pr.avatar_url||DPFP}"></div>
          <div style="flex:1"><div class="post-name">${esc(pr.username)} ${pr.is_private?'🔒':''}</div><div class="post-loc">${timeAgo(p.created_at)} ago</div></div>
          <button class="post-more" onclick="event.stopPropagation();postMenu(${p.id},${p.user_id===currentUser.id})">⋯</button>
        </div>
        <div class="post-media" onclick="openPostViewer(${p.id})" ondblclick="toggleLike(${p.id},this.closest('.post').querySelector('.pa-btn'))">
          ${mediaHtml}
        </div>
        <div class="post-actions">
          <button class="pa-btn ${liked?'liked':''}" onclick="toggleLike(${p.id},this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
          <button class="pa-btn" onclick="openPostViewer(${p.id})"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
          <button class="pa-btn" onclick="sharePostLink(${p.id})"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
        <div class="post-likes" id="likes-${p.id}">${pl.length} ${pl.length===1?'like':'likes'}</div>
        ${p.caption?`<div class="post-caption"><strong onclick="viewUserProfile('${p.user_id}')">${esc(pr.username)}</strong>${linkify(p.caption)}</div>`:''}
        ${pc.length>0?`<div class="post-comments-link" onclick="openPostViewer(${p.id})">View all ${pc.length} comments</div>`:''}
      </div>`;
    }).join('');
  }catch(ex){console.error(ex);el.innerHTML=`<div class="empty-state"><div class="em">⚠️</div><h3>Error</h3><p>${esc(ex.message)}</p></div>`}
}

function postMenu(id,isOwn){if(!isOwn)return;if(confirm('Delete this post?'))deletePost(id)}
async function deletePost(id){
  try{await sb.from('posts').delete().eq('id',id).eq('user_id',currentUser.id);toast('Deleted');
    if($('panel-feed').classList.contains('active'))renderFeed();
    if($('panel-profile').classList.contains('active'))renderProfile(currentUser.id);

async function toggleLike(pid,btn){
  if(!btn)return;
  const liked=btn.classList.contains('liked');btn.classList.toggle('liked');
  const el=$('likes-'+pid);
  if(el){let n=parseInt(el.textContent)||0;const v=liked?Math.max(0,n-1):n+1;el.textContent=`${v} ${v===1?'like':'likes'}`}
  try{
    if(liked){await sb.from('likes').delete().eq('post_id',pid).eq('user_id',currentUser.id)}
    else{
      await sb.from('likes').insert([{post_id:pid,user_id:currentUser.id}]);
      const{data:p}=await sb.from('posts').select('user_id').eq('id',pid).single();
      if(p&&p.user_id!==currentUser.id){ await safeInsert('notifications', [{user_id:p.user_id,actor_id:currentUser.id,actor_username:currentUser.username,actor_avatar:currentUser.avatar_url,type:'like',post_id:pid}]); }
    }
  }catch(e){btn.classList.toggle('liked');toast('Error')}
}

function sharePostLink(pid) {
  const url = window.location.origin + window.location.pathname + '?post=' + pid;
  if (navigator.share) { navigator.share({ title: 'View this post on Your Place', url: url }).catch(() => {}); } 
  else { navigator.clipboard.writeText(url).then(() => toast('Link copied!')).catch(() => prompt('Copy:', url)); }
}

   SEARCH / EXPLORE (Reels only, strict public)

async function renderSearch(){
  $('panel-search').innerHTML=`<div class="search-bar"><div class="search-input"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" placeholder="Search users or reels..." oninput="doSearch()"></div></div><div id="searchResults"></div>`;
  doSearch();
}

async function doSearch(){
  const q=$('searchInput').value.trim().toLowerCase();const r=$('searchResults');
  if(!q){
    r.innerHTML='<div class="spinner"></div>';
    try{
      // 🚨 FIX: Public Reels පමණක් (private ඒවා නොපෙන්වයි)
      const{data:posts}=await sb.from('posts').select('*, profiles!inner(is_private)').not('video_url','is',null).order('created_at',{ascending:false}).limit(50);
      
      if(!posts||!posts.length) { r.innerHTML='<div class="empty-state"><div class="em">🎬</div><h3>No reels yet</h3></div>'; return; }
      
      const vis=posts.filter(p=>{
        if(p.user_id===currentUser.id)return true;
        const isPriv = p.profiles.is_private === true || p.profiles.is_private === 1 || p.profiles.is_private === 'true';
        return !isPriv;
      });

      if(!vis.length){r.innerHTML='<div class="empty-state"><div class="em">🎬</div><h3>No public reels</h3></div>';return}
      r.innerHTML=`<div class="explore-grid">${vis.map(p=>`<div class="grid-item" onclick="openReels(${p.id})"><video src="${p.video_url}#t=0.1" preload="metadata" muted playsinline></video><div class="grid-play">▶</div></div>`).join('')}</div>`;
    }catch(e){r.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3)">Error loading</div>'}
    return;
  }
  r.innerHTML='<div class="spinner"></div>';
  try{
    const{data:users}=await sb.from('profiles').select('*').ilike('username',`%${q}%`).limit(30);
    if(!users||users.length===0){r.innerHTML='<div class="empty-state"><div class="em">🔍</div><h3>No results</h3></div>';return}
    const{data:flw}=await sb.from('follows').select('following_id,status').eq('follower_id',currentUser.id);
    const fm={};(flw||[]).forEach(f=>fm[f.following_id]=f.status);
    r.innerHTML=users.map(u=>{
      let btn='';
      if(u.id!==currentUser.id){
        const st=fm[u.id];

    $('reelsScroll').innerHTML=sorted.map(p=>`
      <div class="reel" data-post="${p.id}">
        <video src="${p.video_url}" loop playsinline></video>
        <div class="reel-overlay">
          <div class="reel-left">
            <div class="reel-user"><img src="${DPFP}"><span>${esc(p.username)}</span></div>
            <div class="reel-cap">${linkify(p.caption||'')}</div>

          <div class="reel-actions">

          </div>
        </div>
      </div>`).join('');
    
    setupReelsObserver();
  }catch(e){$('reelsScroll').innerHTML='<div style="color:#fff;text-align:center;padding:40px">Error</div>'}
}

function setupReelsObserver(){
  if(reelsObserver)reelsObserver.disconnect();
  reelsObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const vid=entry.target.querySelector('video');
      if(entry.isIntersecting){
        vid.play().catch(()=>{});
        // Mark as viewed (safeInsert)
        const pid=entry.target.dataset.post;
        if(pid) safeInsert('post_views', [{post_id:pid, user_id:currentUser.id}]);
      }else{
        vid.pause();
      }
    });
  },{threshold:0.6});
  
  document.querySelectorAll('.reel').forEach(r=>reelsObserver.observe(r));
}

function closeReels(){
  $('reelsOverlay').classList.remove('active');
  if(reelsObserver)reelsObserver.disconnect();
  document.querySelectorAll('#reelsScroll video').forEach(v=>v.pause());
  $('reelsScroll').innerHTML='';
}

/* =====================================================================
   UPLOAD & MISC (Kept same as before)
===================================================================== */
function openUpload(){$('uploadOverlay').classList.add('active');$('upStep1').style.display='flex';$('upStep2').style.display='none';$('upStep3').style.display='none'}
function closeUpload(){$('uploadOverlay').classList.remove('active');upFile=null;if(upObjUrl)URL.revokeObjectURL(upObjUrl)}
function openUploadStory(){toast('Story upload coming soon');}
function goStep(n){$('upStep1').style.display=n===1?'flex':'none';$('upStep2').style.display=n===2?'flex':'none';$('upStep3').style.display=n===3?'flex':'none'}
function handleMediaSelect(e){const f=e.target.files[0];if(!f)return;upFile=f;upType=f.type.startsWith('video')?'video':'image';upObjUrl=URL.createObjectURL(f);if(upType==='image'){$('editImg').src=upObjUrl;$('editImg').style.display='block';$('editVid').style.display='none'}else{$('editVid').src=upObjUrl;$('editVid').style.display='block';$('editImg').style.display='none'}goStep(2);}
function applyFilter(btn,f){upFilter=f;document.querySelectorAll('.up-filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function updateCaptionCount(){const c=$('shareCaption').value.length;$('capCount').textContent=c}
function buildEmojiPicker(){const p=$('emojiPicker');p.innerHTML=EMOJIS.map(e=>`<button onclick="$('chatInput').value+='${e}';hideEmojiPicker()">${e}</button>`).join('')}
function toggleEmojiPicker(){$('emojiPicker').classList.toggle('active')}
function hideEmojiPicker(){$('emojiPicker').classList.remove('active')}

// Init
init();
</script>
