<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Your Place - Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-color: #09090b;
    --surface: rgba(24, 24, 27, 0.6);
    --surface-hover: rgba(39, 39, 42, 0.8);
    --border: rgba(255, 255, 255, 0.08);
    --primary: #8b5cf6;
    --primary-glow: rgba(139, 92, 246, 0.3);
    --accent: #ec4899;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --danger: #ef4444;
    --success: #10b981;
    --font: 'Outfit', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: var(--font); }
  body { background: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%); }
  
  .app-wrapper { width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding-bottom: 80px; background: transparent; }
  @media(min-width: 768px) { .app-wrapper { max-width: 600px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 0 50px rgba(0,0,0,0.5); } }

  /* HEADER */
  .header { position: sticky; top: 0; background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(20px); height: 65px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); z-index: 100; }
  .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; letter-spacing: -0.5px; }
  
  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; height: 65px; background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; display: flex; justify-content: space-around; align-items: center; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  @media(min-width: 768px) { .bottom-nav { max-width: 570px; } }
  .nav-item { cursor: pointer; color: var(--text-muted); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; width: 50px; height: 50px; border-radius: 16px; }
  .nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active { color: var(--text); background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 4px 15px var(--primary-glow); transform: translateY(-5px); }
  .nav-item.active svg { stroke: #fff; }

  /* PANELS */
  .panel { display: none; animation: fadeIn 0.4s ease-out; }
  .panel.active { display: block; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  /* STORIES */
  .stories-container { padding: 15px 20px; display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; }
  .stories-container::-webkit-scrollbar { display: none; }
  .story-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
  .story-item:active { transform: scale(0.95); }
  .story-ring { width: 70px; height: 70px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--primary), var(--accent)); position: relative; }
  .story-img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg-color); object-fit: cover; }
  .story-name { font-size: 12px; color: var(--text-muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

  /* POSTS */
  .post { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
  .post-header { display: flex; align-items: center; padding: 15px 20px; gap: 12px; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); padding: 2px; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .post-user { font-weight: 600; font-size: 15px; }
  .post-time { font-size: 12px; color: var(--text-muted); }
  
  .post-media { width: 100%; max-height: 80vh; object-fit: contain; display: block; background: #000; }
  .post-image { width: 100%; max-height: 600px; object-fit: cover; display: block; }
  
  .post-actions { display: flex; padding: 15px 20px; gap: 20px; align-items: center; }
  .action-btn { cursor: pointer; color: var(--text); transition: transform 0.2s; display: flex; align-items: center; gap: 6px; }
  .action-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; }
  .action-btn:active { transform: scale(0.7); }
  .action-btn.liked svg { fill: var(--danger); stroke: var(--danger); filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
  
  .post-likes { padding: 0 20px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .post-caption { padding: 0 20px; font-size: 14px; line-height: 1.5; }
  .post-caption strong { font-weight: 600; margin-right: 6px; cursor: pointer; }
  .post-caption a { color: var(--primary); text-decoration: none; font-weight: 600; }

  /* UPLOAD PANEL */
  .upload-card { margin: 20px; background: var(--surface); border: 1px dashed var(--primary); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; cursor: pointer; transition: 0.3s; }
  .upload-card:hover { background: var(--surface-hover); border-color: var(--accent); }
  .upload-icon { font-size: 40px; }
  .preview-img { width: 100%; border-radius: 12px; margin-bottom: 15px; display: none; }
  textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; color: var(--text); outline: none; resize: none; font-size: 15px; margin-bottom: 15px; }
  textarea:focus { border-color: var(--primary); }
  .btn-primary { width: 100%; padding: 15px; border-radius: 15px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; font-weight: 700; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 5px 15px var(--primary-glow); transition: 0.2s; }
  .btn-primary:active { transform: scale(0.98); }

  /* CHAT ROOM */
  .chat-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 65px; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(15px); z-index: 90; }
  
  .chat-room { display: flex; flex-direction: column; height: calc(100vh - 80px); height: calc(100dvh - 80px); position: relative; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 150px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.self { align-self: flex-end; flex-direction: row-reverse; }
  .msg-bubble { padding: 14px 18px; border-radius: 22px; font-size: 15px; background: var(--surface); color: var(--text); position: relative; border: 1px solid var(--border); word-wrap: break-word; }
  .msg.self .msg-bubble { background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px var(--primary-glow); }
  .msg:not(.self) .msg-bubble { border-bottom-left-radius: 4px; }
  .msg-bubble a { color: #fff; text-decoration: underline; }
  .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 5px; text-align: right; }
  .msg-img { max-width: 220px; border-radius: 12px; margin-bottom: 6px; display: block; }
  
  .chat-input-area { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); padding: 10px 15px; display: flex; flex-direction: column; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 99; }
  @media(min-width: 768px) { .chat-input-area { max-width: 570px; } }
  .chat-tools { display: flex; gap: 20px; padding: 5px 10px 10px; color: var(--text-muted); }
  .chat-tools svg { width: 24px; height: 24px; cursor: pointer; fill: none; stroke: currentColor; stroke-width: 2; transition: 0.2s; }
  .chat-tools svg:hover { color: var(--primary); }
  .chat-input-row { display: flex; gap: 10px; align-items: center; }
  .chat-input-row input { flex: 1; padding: 12px 18px; border-radius: 20px; border: 1px solid var(--border); outline: none; font-size: 15px; background: var(--bg-color); color: var(--text); }
  .chat-send-btn { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px var(--primary-glow); }

  /* PROFILE */
  .profile-header { padding: 30px 20px; display: flex; align-items: center; gap: 20px; }
  .profile-avatar { width: 90px; height: 90px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
  .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg-color); object-fit: cover; }
  
  /* GRID POSTS FIX */
  .grid-posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 3px; }
  .grid-posts .grid-item { width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 8px; cursor: pointer; background: var(--surface); position: relative; }
  .grid-posts img, .grid-posts video { width: 100%; height: 100%; object-fit: cover; display: block; transition: 0.2s; }
  .grid-posts .grid-item:hover img, .grid-posts .grid-item:hover video { opacity: 0.8; }
  
  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 380px; border-radius: 24px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: popIn 0.3s; position: relative; }
  @keyframes popIn { from{transform:scale(0.95); opacity:0;} to{transform:scale(1); opacity:1;} }
  .input-group { margin-bottom: 15px; }
  .input-group input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 15px; background: var(--bg-color); color: var(--text); outline: none; font-size: 15px; transition: 0.2s; }
  .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
  
  .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 50px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  
  /* VIEW PROFILE MODAL */
  #viewProfileOverlay .modal-box { max-width: 450px; padding: 0; overflow: hidden; }
  .vp-cover { height: 120px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
  .vp-content { padding: 0 20px 20px; text-align: center; margin-top: -50px; }
  .vp-avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--surface); margin: 0 auto 10px; background: var(--bg-color); }
  .vp-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  
  /* VIEW POST MODAL */
  #viewPostOverlay .modal-box { max-width: 500px; padding: 0; overflow: hidden; background: var(--bg-color); }
  .post-viewer-header { display: flex; align-items: center; gap: 10px; padding: 15px; border-bottom: 1px solid var(--border); }
  .post-viewer-media { width: 100%; max-height: 60vh; object-fit: contain; background: #000; display: block; }
  .post-viewer-actions { padding: 15px; }
  
  /* STORY VIEWER */
  .story-viewer { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
  .story-progress { display: flex; gap: 4px; padding: 15px; }
  .progress-segment { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
  .story-media { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>

<div class="app-wrapper">
  <div class="header">
    <div class="logo" onclick="switchPanel('feed')">Your Place</div>
  </div>

  <div class="panel active" id="panel-feed"></div>
  <div class="panel" id="panel-reels"></div>
  <div class="panel" id="panel-upload"></div>
  <div class="panel" id="panel-search"></div>
  <div class="panel" id="panel-chat"></div>
  <div class="panel" id="panel-profile"></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-panel="feed" onclick="switchPanel('feed')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
    <div class="nav-item" data-panel="search" onclick="switchPanel('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
    <div class="nav-item" data-panel="upload" onclick="switchPanel('upload')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
    <div class="nav-item" data-panel="chat" onclick="switchPanel('chat')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
    <div class="nav-item" data-panel="profile" onclick="switchPanel('profile')"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
  </div>
</div>

<!-- VIEW POST MODAL -->
<div class="modal-overlay" id="viewPostOverlay">
  <div class="modal-box">
    <button style="position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.5); border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; z-index:10;" onclick="$('viewPostOverlay').style.display='none'">×</button>
    <div id="viewPostContent"></div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authOverlay">
  <div class="modal-box">
    <h2 style="text-align:center; margin-bottom:25px; font-weight:800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size:28px;" id="authTitle">Create Account</h2>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group"><input id="authEmail" type="email" placeholder="Email Address" required></div>
      <div class="input-group" id="usernameGroup"><input id="authUsername" type="text" placeholder="Username" required></div>
      <div class="input-group"><input id="authPassword" type="password" placeholder="Password" required></div>
      <div id="authError" style="color:var(--danger); font-size:13px; text-align:center; margin-bottom:15px; display:none;"></div>
      <button type="submit" class="btn-primary" id="authSubmitBtn">Sign Up</button>
    </form>
    <div style="text-align:center; margin-top:25px; font-size:14px; color:var(--text-muted);" id="authToggleBox">
      Already have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Log In</a>
    </div>
  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div class="modal-overlay" id="editProfileOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">Edit Profile</h2>
    <div class="input-group"><input type="file" id="avatarFileInput" accept="image/*" onchange="uploadAvatar(event)" style="padding:10px; border:1px dashed var(--border);"></div>
    <div class="input-group"><input id="editUsername" type="text" placeholder="Username"></div>
    <div class="input-group"><input id="editBio" type="text" placeholder="Bio"></div>
    <button class="btn-primary" onclick="saveProfile()">Save Changes</button>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="$('editProfileOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<!-- VIEW OTHER PROFILE MODAL -->
<div class="modal-overlay" id="viewProfileOverlay">
  <div class="modal-box">
    <button style="position:absolute; top:15px; right:15px; background:rgba(0,0,0,0.5); border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; z-index:10;" onclick="$('viewProfileOverlay').style.display='none'">×</button>
    <div class="vp-cover"></div>
    <div class="vp-content">
      <div class="vp-avatar"><img id="vpAvatar" src=""></div>
      <h2 id="vpUsername" style="font-size:22px; font-weight:700; margin-bottom:5px;"></h2>
      <div id="vpBio" style="font-size:14px; color:var(--text-muted); margin-bottom:20px;"></div>
      <button class="btn-primary" onclick="messageUser()">Message</button>
    </div>
  </div>
</div>

<!-- ADD STORY MODAL -->
<div class="modal-overlay" id="addStoryOverlay">
  <div class="modal-box">
    <h2 style="margin-bottom:20px;">Add Story</h2>
    <div class="input-group"><input type="file" id="storyFile" accept="image/*" style="padding:15px; border:1px dashed var(--border); border-radius:15px;"></div>
    <button class="btn-primary" onclick="uploadStory()" id="uploadStoryBtn">Upload to Story</button>
    <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="$('addStoryOverlay').style.display='none'">Cancel</button>
  </div>
</div>

<!-- STORY VIEWER -->
<div class="story-viewer" id="storyViewer">
  <div class="story-progress" id="storyProgress"></div>
  <div id="storyHeader" style="padding: 0 15px; color:white; font-weight:600; display:flex; align-items:center; gap:10px;"></div>
  <div style="flex:1; display:flex; justify-content:center; align-items:center; position:relative;" id="storyContent">
    <div style="position:absolute; left:0; top:0; bottom:0; width:50%; z-index:10;" onclick="prevStory()"></div>
    <div style="position:absolute; right:0; top:0; bottom:0; width:50%; z-index:10;" onclick="nextStory()"></div>
    <img id="storyMedia" class="story-media" src="">
  </div>
</div>

<div id="toast" style="position:fixed; top:20px; left:50%; transform:translate(-50%,-100px); background:var(--text); color:var(--bg-color); padding:12px 24px; border-radius:30px; font-weight:700; z-index:99999; transition:0.3s; opacity:0; pointer-events:none; box-shadow:0 10px 20px rgba(0,0,0,0.3);"></div>

<script>
const SUPABASE_URL = 'https://ujbepvlzrdvcmxpmdsez.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqYmVwdmx6cmR2Y214cG1kc2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTQwNjUsImV4cCI6MjEwNzk5MDA2NX0.-XzEMlr2W_4uOi0QDKaR4KmrPRJGPmXoDz6SlOjfqvE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, authMode = 'signup';
let onlineUsersMap = new Map(), presenceChannel = null;
let activeRoomId = null, activeRoomMembers = [], chatChannel = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let currentStories = [], currentStoryIndex = 0, storyTimer = null;
let currentViewingUserId = null;

const DEFAULT_PFP = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2318181b'/><circle cx='50' cy='35' r='20' fill='%238b5cf6'/><path d='M50 60 C25 60 15 75 15 100 L85 100 C85 75 75 60 50 60 Z' fill='%238b5cf6'/></svg>";

function $(id){ return document.getElementById(id); }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function linkify(text) {
  let escaped = escapeHTML(text);
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return escaped.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.transform='translate(-50%,0)'; t.style.opacity='1'; setTimeout(()=>{ t.style.transform='translate(-50%,-100px)'; t.style.opacity='0'; }, 2500); }

// NAVIGATION
function switchPanel(name){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.panel === name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $(`panel-${name}`).classList.add('active');
  
  if(name==='feed') renderFeed();
  if(name==='reels') renderReels();
  if(name==='chat') renderChatList();
  if(name==='profile' && currentUser) renderProfile(currentUser.id);
  if(name==='search') renderSearch();
  if(name==='upload') renderUpload();
}

// VIEW SINGLE POST
async function viewPost(postId) {
  $('viewPostOverlay').style.display = 'flex';
  $('viewPostContent').innerHTML = `<div class="spinner"></div>`;
  
  try {
    const {data:p} = await sb.from('posts').select('*').eq('id', postId).single();
    const {data:prof} = await sb.from('profiles').select('*').eq('id', p.user_id).maybeSingle();
    const isVideo = p.video_url && p.video_url.length > 0;
    
    const {data:likes} = await sb.from('likes').select('*').eq('post_id', postId);
    const {data:comments} = await sb.from('comments').select('*').eq('post_id', postId).order('created_at');

// AUTH
function showAuthGate() {
  $('authOverlay').style.display = 'flex';
  document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'none');
}
function toggleAuthMode(e) {
  if(e) e.preventDefault();
  authMode = authMode === 'login' ? 'signup' : 'login';
  const isLogin = authMode === 'login';
  $('usernameGroup').style.display = isLogin ? 'none' : 'block';
  $('authTitle').textContent = isLogin ? 'Welcome Back' : 'Create Account';
  $('authSubmitBtn').textContent = isLogin ? 'Log In' : 'Sign Up';
  $('authToggleBox').innerHTML = isLogin 
    ? `Don't have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign Up</a>`
    : `Have an account? <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary); font-weight:600; text-decoration:none;">Log In</a>`;
}

async function handleAuth(e) {
  e.preventDefault();
  const btn = $('authSubmitBtn'), err = $('authError');
  err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Wait...';
  try {
    const email = $('authEmail').value.trim(), password = $('authPassword').value, username = $('authUsername').value.trim();
    if(authMode === 'login') {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if(error) throw error;
      let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
      currentUser = { id: data.user.id, username: prof?.username || email.split('@')[0] };
    } else {
      const {data, error} = await sb.auth.signUp({email, password, options:{data:{username}}});
      if(error) throw error;
      if(data.session) { currentUser = { id: data.user.id, username }; await sb.from('profiles').insert([{id: data.user.id, username}]); }
      else throw new Error('Check email to confirm.');
    }
    $('authOverlay').style.display = 'none';
    document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'auto');
    initApp(); 
  } catch(ex) { err.textContent = ex.message; err.style.display = 'block'; } 
  finally { btn.disabled = false; btn.textContent = authMode === 'login' ? 'Log In' : 'Sign Up'; }
}

// VIEW USER PROFILE
async function viewUserProfile(userId) {
  if(userId === currentUser.id) { switchPanel('profile'); return; }
  
  currentViewingUserId = userId;
  $('viewProfileOverlay').style.display = 'flex';
  
  $('vpUsername').textContent = 'Loading...';
  $('vpBio').textContent = '';
  $('vpAvatar').src = DEFAULT_PFP;
  
  const {data:prof} = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(prof) {
    $('vpUsername').textContent = prof.username;
    $('vpBio').textContent = prof.bio || 'No bio yet.';
    if(prof.avatar_url) $('vpAvatar').src = prof.avatar_url;
  }
}

async function messageUser() {
  if(!currentViewingUserId) return;
  $('viewProfileOverlay').style.display = 'none';
  
  try {
    const {data:myRooms} = await sb.from('room_members').select('room_id').eq('user_id', currentUser.id);
    const myRoomIds = (myRooms||[]).map(m => m.room_id);
    
    let existingRoomId = null;
    if(myRoomIds.length > 0) {
      const {data:theirRooms} = await sb.from('room_members').select('room_id').eq('user_id', currentViewingUserId).in('room_id', myRoomIds);
      for(const r of (theirRooms||[])) {
        const {data:room} = await sb.from('chat_rooms').select('*').eq('id', r.room_id).single();
        if(room && !room.is_group) { existingRoomId = room.id; break; }
      }
    }
    
    if(!existingRoomId) {
      const {data:newRoom, error} = await sb.from('chat_rooms').insert([{is_group: false, created_by: currentUser.id}]).select().single();
      if(error) throw error;
      existingRoomId = newRoom.id;
      
      const {data:theirProf} = await sb.from('profiles').select('username').eq('id', currentViewingUserId).single();
      await sb.from('room_members').insert([
        {room_id: existingRoomId, user_id: currentUser.id, username: currentUser.username},
        {room_id: existingRoomId, user_id: currentViewingUserId, username: theirProf?.username || 'User'}
      ]);
    }
    
    switchPanel('chat');
    openChatRoom(existingRoomId, false);
  } catch(ex) { toast('Error opening chat'); console.error(ex); }
}

// SHARE
function sharePost(postId) {
  const url = window.location.origin + '?post=' + postId;
  if (navigator.share) {
    navigator.share({ title: 'Your Place', text: 'Check out this post!', url: url })
      .then(() => toast('Shared successfully!'))
      .catch(() => fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function fallbackCopy(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Link copied! 🔗'));
  } else {
    const textArea = document.createElement("textarea");
    textArea.value = text; textArea.style.position = "absolute"; textArea.style.left = "-999999px";
    document.body.prepend(textArea); textArea.select();
    try { document.execCommand('copy'); toast('Link copied! 🔗'); } catch (err) { toast('Failed to copy'); }
    textArea.remove();
  }
}

// LIKE
async function toggleLike(postId, btn) {
  const isLiked = btn.classList.contains('liked');
  btn.classList.toggle('liked');
  
  // Update feed count
  const countEl = $(`likes-count-${postId}`);
  if(countEl) {
    let count = parseInt(countEl.textContent) || 0;
    countEl.textContent = isLiked ? `${count - 1} likes` : `${count + 1} likes`;
  }
  
  // Update modal count
  const modalCountEl = $(`modal-likes-count-${postId}`);
  if(modalCountEl) {
    let count = parseInt(modalCountEl.textContent) || 0;
    modalCountEl.textContent = isLiked ? `${count - 1} likes` : `${count + 1} likes`;
  }

  try {
    if(isLiked) await sb.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
    else await sb.from('likes').insert([{post_id: postId, user_id: currentUser.id}]);
  } catch(ex) { 
    btn.classList.toggle('liked');
    toast('Error liking post'); 
  }
}

function renderUpload() {

      <input type="file" id="postFile" accept="image/*,video/*" style="display:none;" onchange="previewPost(event)">
      <div class="upload-card" onclick="$('postFile').click()">

let postFileObj = null;
function previewPost(e) {
  const file = e.target.files[0]; if(!file) return;
  postFileObj = file;
  const url = URL.createObjectURL(file);
  const img = $('postPreview'); img.src = url; img.style.display = 'block';
}

async function createPost() {
  const caption = $('postCaption').value.trim();
  if(!postFileObj) { toast('Please select a photo/video'); return; }
  const btn = $('postBtn'); btn.textContent = 'Uploading...'; btn.disabled = true;
  try {
    const isVideo = postFileObj.type.startsWith('video');
    const bucket = isVideo ? 'videos' : 'posts';
    const path = `${currentUser.id}/${Date.now()}.${postFileObj.name.split('.').pop()}`;
    const {error: uploadErr} = await sb.storage.from(bucket).upload(path, postFileObj);
    if(uploadErr) throw uploadErr;
    const {data: {publicUrl}} = sb.storage.from(bucket).getPublicUrl(path);
    const {error: dbErr} = await sb.from('posts').insert([{
      user_id: currentUser.id, username: currentUser.username, 
      caption: caption || '', image_url: isVideo ? null : publicUrl, video_url: isVideo ? publicUrl : null
    }]);
    if(dbErr) throw dbErr;
    toast('Posted successfully! 🎉'); postFileObj = null; switchPanel('feed');
  } catch(ex) { toast('Error: ' + ex.message); } 
  finally { btn.textContent = 'Share Post'; btn.disabled = false; }
}

// CHAT
async function renderChatList() {
  const el = $('panel-chat'); el.innerHTML = `<div class="spinner"></div>`;
  try {
    const {data:memberships} = await sb.from('room_members').select('room_id').eq('user_id', currentUser.id);
    const roomIds = (memberships||[]).map(m => m.room_id);
    if(roomIds.length === 0) { el.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">No messages yet.</div>`; return; }

    const [roomsRes, membersRes, messagesRes] = await Promise.all([
      sb.from('chat_rooms').select('*').in('id', roomIds).order('created_at', {ascending:false}),
      sb.from('room_members').select('*').in('room_id', roomIds),
      sb.from('chat_messages').select('*').in('room_id', roomIds).order('created_at', {ascending:false})
    ]);
    const rooms = roomsRes.data || [], allMembers = membersRes.data || [], allMessages = messagesRes.data || [];

    let roomsHTML = rooms.map(r => {
      const otherMember = !r.is_group ? allMembers.filter(m => m.room_id === r.id).find(m => m.user_id !== currentUser.id) : null;
      const isOnline = otherMember && onlineUsersMap.has(otherMember.user_id);
      const lastMsg = allMessages.find(m => m.room_id === r.id);
      let displayName = r.name || 'Chat'; if(!r.is_group && otherMember) displayName = otherMember.username;
      
      let preview = 'No messages';
      if(lastMsg) {
         if(lastMsg.text) preview = lastMsg.text;
         else if(lastMsg.image_url) preview = '📷 Photo';
         else if(lastMsg.audio_url) preview = '🎤 Voice';
      }

      return `
      <div style="display:flex; align-items:center; gap:15px; padding:15px 20px; border-bottom:1px solid var(--border); cursor:pointer; transition:0.2s;" onclick="openChatRoom(${r.id}, ${r.is_group})">
        <div style="position:relative;">
          <div class="avatar" style="width:55px; height:55px;">${r.is_group ? '👥' : `<img src="${DEFAULT_PFP}">`}</div>
          ${isOnline ? '<div style="position:absolute; bottom:0; right:0; width:14px; height:14px; background:var(--success); border-radius:50%; border:2px solid var(--bg-color); box-shadow:0 0 8px var(--success);"></div>' : ''}
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:600; font-size:16px;">${escapeHTML(displayName)}</div>
          <div style="font-size:14px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">${linkify(preview)}</div>
        </div>
        <button style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:20px;" onclick="event.stopPropagation(); deleteChat(${r.id})">🗑️</button>
      </div>`;
    }).join('');

    el.innerHTML = `<div style="padding:20px; font-weight:700; font-size:24px;">Messages</div><div>${roomsHTML}</div>`;
  } catch(ex) { el.innerHTML = `<div style="text-align:center; padding:20px;">Error loading chats.</div>`; }
}

  const otherUser = !isGroup ? activeRoomMembers.find(m => m.user_id !== currentUser.id) : null;
  const isOnline = otherUser && onlineUsersMap.has(otherUser.user_id);
  const statusHTML = !isGroup ? `<div style="font-size:12px; color:${isOnline ? 'var(--success)' : 'var(--text-muted)'};">${isOnline ? '● Online' : 'Offline'}</div>` : '';

  el.innerHTML = `
    <div class="chat-room">
      <div class="chat-header">
        <button style="background:none; border:none; color:var(--text); font-size:26px; cursor:pointer;" onclick="renderChatList()">←</button>
        <div class="avatar" onclick="viewUserProfile('${otherUser?.user_id}')">${isGroup ? '👥' : `<img src="${DEFAULT_PFP}">`}</div>
        <div>
          <div style="font-weight:600; font-size:17px;">${escapeHTML(roomName)}</div>
          ${statusHTML}
        </div>
      </div>
      <div class="chat-messages" id="chatMessagesBox"></div>
      
      <div class="chat-input-area">
        <div class="chat-tools">
          <span style="cursor:pointer;" onclick="$('chatImageUpload').click()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></span>
          <input type="file" id="chatImageUpload" hidden accept="image/*" onchange="uploadChatImage(event)">
          <span style="cursor:pointer;" onclick="toggleRecording()" id="micBtn"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></span>
        </div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send-btn" onclick="sendChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px; height:20px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
        </div>
      </div>
    </div>
  `;

  loadMessages(); subscribeToMessages();
}

function toggleRecording() {
  if(isRecording) {
    mediaRecorder.stop(); isRecording = false; $('micBtn').style.color = 'var(--text-muted)';
  } else {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRecorder = new MediaRecorder(stream); audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const file = new File([audioBlob], `voice_${Date.now()}.webm`);
        await uploadChatMedia(file, 'audio');
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start(); isRecording = true; $('micBtn').style.color = 'var(--danger)';
    }).catch(() => alert('Microphone denied.'));
  }
}

async function uploadChatImage(e) {
  const file = e.target.files[0];
  if(file) await uploadChatMedia(file, 'image');
}

async function uploadChatMedia(file, type) {
  try {
    const path = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;
    const {error: uploadError} = await sb.storage.from('chat_media').upload(path, file);
    if(uploadError) throw uploadError;
    
    const {data: {publicUrl}} = sb.storage.from('chat_media').getPublicUrl(path);
    
    const msgData = { room_id: activeRoomId, user_id: currentUser.id, username: currentUser.username, text: '' };
    if(type === 'image') msgData.image_url = publicUrl;
    if(type === 'audio') msgData.audio_url = publicUrl;
    
    const {error: dbError} = await sb.from('chat_messages').insert([msgData]);
    if(dbError) {
      if(dbError.message.includes('column') && dbError.message.includes('does not exist')) {
        alert('Database Error: You forgot to run the SQL query to add image_url and audio_url columns!');
      } else {
        throw dbError;
      }
    }
  } catch(ex) { toast('Upload failed: ' + ex.message); }
}

// MESSAGE RENDERER
function renderMessageContent(m) {
  let content = '';
  if (m.text) {
    if (m.text.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
      content += `<img src="${m.text}" class="msg-img" style="max-width:100%; border-radius:10px;" alt="Image" />`;
    } else {
      content += `<div>${linkify(m.text)}</div>`;
    }
  }
  if (m.image_url) content += `<img src="${m.image_url}" class="msg-img" alt="Image" />`;
  if (m.audio_url) content += `<audio controls src="${m.audio_url}" style="max-width:200px; height:35px; filter: invert(1);"></audio>`;
  return content;
}

async function loadMessages() {
  const {data:msgs} = await sb.from('chat_messages').select('*').eq('room_id', activeRoomId).order('created_at');
  const box = $('chatMessagesBox');
  if(!msgs || msgs.length === 0) { box.innerHTML = `<p style="text-align:center; font-size:13px; margin-top:20px; color:var(--text-muted);">Say hi! 👋</p>`; return; }
  
  box.innerHTML = msgs.map(m => `
    <div class="msg ${m.user_id === currentUser.id ? 'self' : ''}">
      <div>
        <div class="msg-bubble">
          ${renderMessageContent(m)}
        </div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      </div>
    </div>
  `).join('');
  
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

async function sendChat() {
  const input = $('chatInput'); const text = input.value.trim();
  if(!text || !activeRoomId) return;
  input.value = '';
  await sb.from('chat_messages').insert([{room_id: activeRoomId, user_id: currentUser.id, username: currentUser.username, text}]);
  
  const box = $('chatMessagesBox');
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

function subscribeToMessages() {
  if(chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel('chat-'+activeRoomId).on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages', filter:`room_id=eq.${activeRoomId}`}, (payload) => {
    const m = payload.new;
    const box = $('chatMessagesBox');
    if(box) {
      const div = document.createElement('div');
      div.className = `msg ${m.user_id === currentUser.id ? 'self' : ''}`;
      div.innerHTML = `
        <div>
          <div class="msg-bubble">
            ${renderMessageContent(m)}
          </div>
          <div class="msg-time">${formatTime(m.created_at)}</div>
        </div>
      `;
      box.appendChild(div); 
      requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
    }
  }).subscribe();
}

function formatTime(dateStr) {
  if(!dateStr) return '';
  return new Date(dateStr).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}

// SEARCH
async function renderSearch() {
  $('panel-search').innerHTML = `
    <div style="padding:20px;">
      <input type="text" id="searchInput" placeholder="Search users..." oninput="doSearch()" style="width:100%; padding:16px; border:1px solid var(--border); border-radius:15px; background:var(--surface); color:var(--text); outline:none; font-size:15px;">
      <div id="searchResults" style="margin-top:20px;"></div>
    </div>
  `;
  doSearch();
}

async function doSearch() {
  const q = $('searchInput').value.toLowerCase(), resEl = $('searchResults');
  let query = sb.from('profiles').select('*').limit(20);
  if(q) query = query.ilike('username', `%${q}%`);
  const {data:users} = await query;
  resEl.innerHTML = (users||[]).map(u => `
    <div style="display:flex; align-items:center; gap:15px; padding:15px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="viewUserProfile('${u.id}')">
      <div class="avatar"><img src="${u.avatar_url || DEFAULT_PFP}"></div>
      <div style="font-weight:600; font-size:15px;">${escapeHTML(u.username)}</div>
    </div>
  `).join('');
}

// INIT & PRESENCE
async function initApp() {
  renderFeed();
  subscribePresence();
}

async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if(session) {
    let {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    currentUser = { id: session.user.id, username: prof?.username || session.user.email.split('@')[0] };
    document.querySelectorAll('.nav-item').forEach(el => el.style.pointerEvents = 'auto');
    initApp();
  } else {
    showAuthGate();
  }
}

function subscribePresence() {
  if(presenceChannel) return;
  presenceChannel = sb.channel('online-users', { config: { presence: { key: currentUser.id } } });
  
  presenceChannel.on('presence', { event: 'sync' }, () => {
    onlineUsersMap.clear();
    const state = presenceChannel.presenceState();
    for(const id in state) {
      if(state[id].length > 0) onlineUsersMap.set(id, state[id][0].username);
    }
    
    if($('panel-chat').classList.contains('active') && !activeRoomId) {
       renderChatList();
    }
  });
  
  presenceChannel.subscribe(async (status) => {
    if(status === 'SUBSCRIBED') await presenceChannel.track({ username: currentUser.username });
  });
}

function timeAgo(dateStr){
  const diff = Math.floor((new Date() - new Date(dateStr))/1000);
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

init();
</script>
